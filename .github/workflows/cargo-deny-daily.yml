# FLOW-010 F2 (PMAT-3151, GH-1616): nightly cargo-deny advisories via the fleet reusable workflow in paiml/infra.
# Red andons with the line `[advisory-drift] <repo> <sha> RED <run-url>`. Concurrency belongs to this caller.
name: Cargo Deny Daily
on:
  schedule:
    - cron: '23 4 * * *'
concurrency: { group: 'cargo-deny-daily-${{ github.ref }}', cancel-in-progress: false }
permissions:
  contents: read
jobs:
  advisories:
    uses: paiml/infra/.github/workflows/cargo-deny-daily.yml@47c76b857de07c7b9755cebc8bcbe2b25467a496
    with: { runs-on: '["self-hosted","gate-light"]', manifest-paths: 'Cargo.toml' }
