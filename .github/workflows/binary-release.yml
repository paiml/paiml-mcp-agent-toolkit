name: Binary Release

# Attaches cross-compiled `pmat` binaries to a GitHub Release as tar.gz +
# sha256. Decoupled from `cargo publish` — the manual publish flow Noah
# prefers (see commit da58ced9) stays intact, and downstream consumers
# can `curl` the binary instead of `cargo install pmat` (which compiles
# from source and takes ~5 minutes cold).
#
# Triggered by:
#   - `release: published` — fires automatically when a release is published
#   - `workflow_dispatch` — manual re-run / backfill, takes a tag input
#
# Targets: 4 Linux (x86_64/aarch64 × musl/gnu). musl variants are static
# and ideal for Docker / scratch / Alpine; gnu variants are smaller and
# match typical Linux distributions. aarch64 builds use `cross`.
#
# glibc floor (#1428): a gnu binary runs only where glibc is at least the
# version it was linked against. ubuntu-latest carries 2.39, so a plain
# `cargo build` there is WONT-RUN on 2.35 hosts. A gnu row names its floor
# in `glibc:`; x86_64 links against it with cargo-zigbuild, aarch64 is
# already below it in the cross image, and both rows assert it on the
# built binary before anything is uploaded.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach binaries to (e.g. v3.16.0)'
        required: true
        type: string

permissions:
  contents: write  # upload assets to the release

concurrency:
  group: binary-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  CROSS_VERSION: v0.2.5

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            glibc: '2.35'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            glibc: '2.35'
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved (release event missing tag_name and no dispatch input)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building pmat for $TAG → ${{ matrix.target }}"

      - name: Checkout at tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools

      # Cross is used for aarch64 targets — pinned to v0.2.5 (matches the
      # legacy disabled release.yml; later cross releases have broken CI
      # in the past, ripgrep lesson).
      - name: Install cross
        if: matrix.cross
        run: |
          dir="$RUNNER_TEMP/cross"
          mkdir -p "$dir"
          curl -sL "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$dir"
          echo "$dir" >> "$GITHUB_PATH"

      # zig 0.13.0 + cargo-zigbuild 0.23.4, each checked against its sha256
      # (ziglang.org/download/index.json; the release's own .sha256 files).
      # 0.23 is the floor: 0.22.3 passes rustc's aarch64 `-Wl,--fix-cortex-a53-843419`
      # to zig cc, which rejects it (rust-cross/cargo-zigbuild#451; nightly run 36227537517).
      - name: Install zig + cargo-zigbuild
        if: matrix.glibc && !matrix.cross
        run: |
          dir="$RUNNER_TEMP/zigbuild"
          mkdir -p "$dir" && cd "$dir"
          arch=$(uname -m)
          case "$arch" in
            x86_64)  zig_sha=d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
                     czb_sha=6b69963040818ca1ef573d8135a95aa902e17cf7f873c32c6426642dadfe7f59 ;;
            aarch64) zig_sha=041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556
                     czb_sha=25cf2cdc6cde848b33a761ff2cf46d1efe6ba7e1adfc4b6f3ee2d570cacb5419 ;;
            *) echo "::error::no pinned zig for $arch"; exit 1 ;;
          esac
          curl -fsSLo zig.tar.xz "https://ziglang.org/download/0.13.0/zig-linux-${arch}-0.13.0.tar.xz"
          curl -fsSLo czb.tar.xz "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-${arch}-unknown-linux-gnu.tar.xz"
          printf '%s  zig.tar.xz\n%s  czb.tar.xz\n' "$zig_sha" "$czb_sha" | sha256sum -c -
          tar xJf zig.tar.xz && tar xJf czb.tar.xz
          echo "$dir/zig-linux-${arch}-0.13.0" >> "$GITHUB_PATH"
          echo "$dir/cargo-zigbuild-${arch}-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: binary-${{ matrix.target }}

      - name: Build pmat
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --bin pmat --target ${{ matrix.target }} --locked
          elif [ -n "${{ matrix.glibc }}" ]; then
            # `<triple>.<glibc>` links against that glibc; the binary still lands in target/<triple>/.
            cargo zigbuild --release --bin pmat --target ${{ matrix.target }}.${{ matrix.glibc }} --locked
          else
            cargo build --release --bin pmat --target ${{ matrix.target }} --locked
          fi

      - name: Assert the glibc floor
        if: matrix.glibc
        run: |
          bin="target/${{ matrix.target }}/release/pmat"
          floor='${{ matrix.glibc }}'
          max=$(readelf --dyn-syms -W "$bin" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -Vu | tail -n 1 || true)
          if [ -z "$max" ]; then echo "::error::read no GLIBC symbol versions from $bin"; exit 1; fi
          echo "highest GLIBC symbol version in $bin: $max (floor $floor)"
          if [ "$(printf '%s\n%s\n' "$max" "$floor" | sort -V | tail -n 1)" != "$floor" ]; then
            echo "::error::$bin needs GLIBC_$max, above the $floor floor — WONT-RUN on older hosts (#1428)"
            exit 1
          fi

      - name: Strip binary
        run: |
          TARGET="${{ matrix.target }}"
          BIN_PATH="target/${TARGET}/release/pmat"
          # Each cross image ships the matching ${triple}-strip; the
          # gnu image does NOT carry the musl variant and vice-versa
          # (regression: v3.16.0 first run failed aarch64-musl because
          # this step called aarch64-linux-gnu-strip in the musl image).
          case "$TARGET" in
            aarch64-unknown-linux-musl) STRIP=aarch64-linux-musl-strip ;;
            aarch64-unknown-linux-gnu)  STRIP=aarch64-linux-gnu-strip ;;
            *)                          STRIP="" ;;
          esac
          if [ -n "$STRIP" ]; then
            docker run --rm -v "$PWD/target:/target:Z" \
              "ghcr.io/cross-rs/${TARGET}:main" \
              "$STRIP" "/$BIN_PATH"
          else
            strip "$BIN_PATH"
          fi
          ls -la "$BIN_PATH"

      - name: Package archive
        id: package
        run: |
          VERSION="${{ steps.tag.outputs.tag }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="pmat-${VERSION}-${TARGET}"
          mkdir -p "$ARCHIVE"
          cp "target/${TARGET}/release/pmat" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT LICENSE-APACHE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "archive=${ARCHIVE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha=${ARCHIVE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          du -h "${ARCHIVE}.tar.gz"

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.sha }}" \
            --clobber

  summary:
    name: Summary
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always()
    steps:
      - name: Write summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          STATUS="${{ needs.build.result }}"
          {
            echo "### Binary Release: $TAG"
            echo ""
            if [ "$STATUS" = "success" ]; then
              echo "- Build matrix: **4/4 targets succeeded**"
            else
              echo "- Build matrix: **partial** (status=$STATUS)"
            fi
            echo "- Targets:"
            echo "  - x86_64-unknown-linux-musl"
            echo "  - x86_64-unknown-linux-gnu"
            echo "  - aarch64-unknown-linux-musl"
            echo "  - aarch64-unknown-linux-gnu"
          } >> "$GITHUB_STEP_SUMMARY"
