# Nightly binary builds — cross-compiled for 5 targets
# Maintained in this repo. The generator named here before (infra machines/clean-room/deploy-workflows.sh) was deleted by paiml/infra#87 (PMAT-166).
# Spec: docs/specifications/release-system.md
#
# Schedule: daily 4am UTC. Manual trigger via workflow_dispatch.
# Skips build if no commits in the last 24 hours.
#
# Produces: pmat-{target}.tar.gz (linux/mac) or .zip (windows)
# Published as GitHub prerelease under the "nightly" tag.

name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Check for recent activity ────────────────────────────
  check-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_commits: ${{ steps.check.outputs.has_commits }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for commits in last 24h
        id: check
        run: |
          RECENT=$(git log --oneline --since="24 hours ago" | wc -l)
          if [ "$RECENT" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "has_commits=true" >> "$GITHUB_OUTPUT"
            echo "Found $RECENT commit(s) in last 24h (or manual trigger)"
          else
            echo "has_commits=false" >> "$GITHUB_OUTPUT"
            echo "No commits in last 24h — skipping nightly build"
          fi

  # ── Cross-compile binaries (5 targets) ───────────────────
  build:
    needs: check-activity
    if: needs.check-activity.outputs.has_commits == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc: the floor a gnu binary is linked against (cargo-zigbuild), and
          # asserted on the result. The runner's own glibc (2.39) would be the
          # floor otherwise — WONT-RUN on 2.35 hosts (#1428).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            glibc: '2.35'
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm  # native ARM64, GA + free for public repos
            glibc: '2.35'
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Checkout provable-contracts (path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: paiml/provable-contracts
          path: provable-contracts

      - name: Symlink provable-contracts for Cargo path deps
        if: runner.os != 'Windows'
        run: ln -sf "$GITHUB_WORKSPACE/provable-contracts" "$GITHUB_WORKSPACE/../provable-contracts"

      - name: Symlink provable-contracts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE\..\provable-contracts" -Target "$env:GITHUB_WORKSPACE\provable-contracts" -Force

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure target is installed
        run: rustup target add ${{ matrix.target }}

      # zig 0.13.0 + cargo-zigbuild 0.23.4, each checked against its sha256
      # (ziglang.org/download/index.json; the release's own .sha256 files).
      # 0.23 is the floor: 0.22.3 passes rustc's aarch64 `-Wl,--fix-cortex-a53-843419`
      # to zig cc, which rejects it (rust-cross/cargo-zigbuild#451; nightly run 36227537517).
      - name: Install zig + cargo-zigbuild
        if: matrix.glibc
        run: |
          dir="$RUNNER_TEMP/zigbuild"
          mkdir -p "$dir" && cd "$dir"
          arch=$(uname -m)
          case "$arch" in
            x86_64)  zig_sha=d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
                     czb_sha=6b69963040818ca1ef573d8135a95aa902e17cf7f873c32c6426642dadfe7f59 ;;
            aarch64) zig_sha=041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556
                     czb_sha=25cf2cdc6cde848b33a761ff2cf46d1efe6ba7e1adfc4b6f3ee2d570cacb5419 ;;
            *) echo "::error::no pinned zig for $arch"; exit 1 ;;
          esac
          curl -fsSLo zig.tar.xz "https://ziglang.org/download/0.13.0/zig-linux-${arch}-0.13.0.tar.xz"
          curl -fsSLo czb.tar.xz "https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.23.4/cargo-zigbuild-${arch}-unknown-linux-gnu.tar.xz"
          printf '%s  zig.tar.xz\n%s  czb.tar.xz\n' "$zig_sha" "$czb_sha" | sha256sum -c -
          tar xJf zig.tar.xz && tar xJf czb.tar.xz
          echo "$dir/zig-linux-${arch}-0.13.0" >> "$GITHUB_PATH"
          echo "$dir/cargo-zigbuild-${arch}-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Build release binary
        if: '!matrix.glibc'
        run: cargo build --release --bin pmat --target ${{ matrix.target }}

      # `<triple>.<glibc>` links against that glibc; the binary still lands in target/<triple>/.
      - name: Build release binary (glibc floor)
        if: matrix.glibc
        run: cargo zigbuild --release --bin pmat --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Assert the glibc floor
        if: matrix.glibc
        run: |
          bin="target/${{ matrix.target }}/release/pmat"
          floor='${{ matrix.glibc }}'
          max=$(readelf --dyn-syms -W "$bin" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/^GLIBC_//' | sort -Vu | tail -n 1 || true)
          if [ -z "$max" ]; then echo "::error::read no GLIBC symbol versions from $bin"; exit 1; fi
          echo "highest GLIBC symbol version in $bin: $max (floor $floor)"
          if [ "$(printf '%s\n%s\n' "$max" "$floor" | sort -V | tail -n 1)" != "$floor" ]; then
            echo "::error::$bin needs GLIBC_$max, above the $floor floor — WONT-RUN on older hosts (#1428)"
            exit 1
          fi

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE="pmat-${{ matrix.target }}"
          mkdir -p "$ARCHIVE"
          cp "target/${{ matrix.target }}/release/pmat" "$ARCHIVE/"
          for f in README.md LICENSE LICENSE-MIT COPYING UNLICENSE; do
            [ -f "$f" ] && cp "$f" "$ARCHIVE/"
          done
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE"
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"
          echo "Packaged: ${ARCHIVE}.tar.gz ($(du -h "${ARCHIVE}.tar.gz" | cut -f1))"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "pmat-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $archive
          Copy-Item "target/${{ matrix.target }}/release/pmat.exe" "$archive/"
          foreach ($f in @("README.md", "LICENSE", "LICENSE-MIT", "COPYING", "UNLICENSE")) {
            if (Test-Path $f) { Copy-Item $f "$archive/" }
          }
          Compress-Archive -Path "$archive/*" -DestinationPath "$archive.zip"
          $hash = (Get-FileHash "$archive.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive.zip" | Out-File -Encoding ascii "$archive.zip.sha256"
          Write-Host "Packaged: $archive.zip"

      - name: Upload artifact (unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pmat-${{ matrix.target }}
          path: |
            pmat-${{ matrix.target }}.tar.gz
            pmat-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact (windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pmat-${{ matrix.target }}
          path: |
            pmat-${{ matrix.target }}.zip
            pmat-${{ matrix.target }}.zip.sha256

  # ── Create/update nightly prerelease ─────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          make_latest: false
          body: |
            Automated nightly build from `main`.

            **Date:** ${{ github.event.repository.updated_at || github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}

            > This is a prerelease. For stable releases, see the latest tagged version.
          files: |
            artifacts/*
