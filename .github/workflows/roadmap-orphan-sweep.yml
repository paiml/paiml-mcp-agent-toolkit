name: roadmap-orphan-sweep
# CB-2115 (roadmap <-> GitHub bijection) reads live repo-wide state, so it is not a per-PR
# check. It runs here on master; a red names the orphan so its owner flips the row.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  cb-2115:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --bin pmat --locked
      - name: CB-2115 on master
        env:
          GH_TOKEN: ${{ github.token }}
        id: check
        continue-on-error: true
        run: ./target/debug/pmat comply check --checks CB-2115 2>&1 | tee /tmp/cb2115.out; exit "${PIPESTATUS[0]}"
      # LAB rule: a red opens or updates ONE ticket, then stays silent.
      - name: open or update the one ticket on red
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CB-2115: roadmap and GitHub disagree (nightly sweep)"
          body="$(printf 'The hourly sweep found an orphan.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s' "$(tail -n 40 /tmp/cb2115.out)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body" --label lab-sweep; fi
      - name: the sweep stays red when CB-2115 is red
        if: steps.check.outcome == 'failure'
        run: exit 1
