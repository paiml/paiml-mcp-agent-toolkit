# CB-2102: the lowering half of the ratchet.
#
# The gate (`pmat comply check`, rule CB-2102, and the `--lib` test
# `the_committed_ratchet_holds_at_head`) only ever asserts that a metric has
# not got WORSE. Something has to notice when it gets better, or every baseline
# stays at whatever it was on the day it was captured and the ratchet stops
# ratcheting after its first turn.
#
# This job measures, lowers, and opens a PR. It cannot loosen anything: the new
# numbers come from `kernel::next_baseline`, which is monotone non-increasing
# (INV-2102-2) and idempotent (INV-2102-3), and `rewrite::apply` re-parses what
# it wrote before anything is committed. It never pushes to a protected branch.
#
# No step is `continue-on-error` and no command is `|| true`. A lowering pass
# that cannot run must fail visibly: a silent one leaves the baselines frozen
# and looks identical to a tree that never improved.
name: ratchet-lower

on:
  schedule:
    # Weekly, Monday 05:17 UTC. Off the hour on purpose — the top of the hour
    # is the busiest slot on shared runners and the least likely to start.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ratchet-lower
  cancel-in-progress: false

jobs:
  lower:
    name: lower ratchet baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The raise check compares against the previous COMMITTED version of
          # .pmat-ratchet.toml, so a depth-1 checkout would leave the gate
          # unable to read what the file used to say.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build pmat
        run: cargo build --release --bin pmat

      - name: Lower every baseline the tree has beaten
        run: ./target/release/pmat comply ratchet --lower --path .

      - name: Open a pull request when a baseline moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .pmat-ratchet.toml; then
            echo "no baseline moved"
            exit 0
          fi
          branch="ratchet/lower-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .pmat-ratchet.toml
          git commit -m "chore: lower ratchet baselines the tree has already beaten

          Generated by .github/workflows/ratchet-lower.yml (CB-2102). Every number
          here was measured by the metric's own committed command; none can be
          larger than it was, because next_baseline is monotone non-increasing.

          PMAT-630"
          git push -u origin "$branch"
          gh pr create --fill --base "${GITHUB_REF_NAME}"
