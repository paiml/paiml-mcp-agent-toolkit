# Sovereign CI — calls reusable workflow from paiml/.github
name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    # infra#3828 RS-09: a draft starts nothing; marking it ready starts the run.
    types: [opened, synchronize, reopened, ready_for_review]
  # PMAT-719 (goal-mode.md §7.1): a gate that is not evaluated on the merge
  # queue is a gate the queue bypasses. No queue is known to be enabled; the
  # trigger costs nothing and closes the hole before anyone opens it.
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # infra#3828: a new push to an ordinary PR cancels that PR's superseded run. Runs on master,
  # merge_group and train/* or batch/* heads are never cancelled: a cancelled master run is a
  # master with no verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'train/') && !startsWith(github.head_ref, 'batch/') }}
# infra#3828 RS-06: no debug info and no incremental state in CI builds.
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    uses: paiml/.github/.github/workflows/sovereign-ci.yml@fbee3788a0ed92d09974ac21ea9bc97d373af6f0 # main
    with:
      repo: ${{ github.event.repository.name }}
      heavy_on: train
      # PMAT-1313 — nextest is OFF here, and the measurement that turned it off is
      # the point of this comment. Do not re-enable it without re-reading this.
      #
      # LOCAL, 21,536 lib tests, one machine, one binary:
      #   cargo test --lib     1227.83s
      #   cargo nextest run     100.51s      12.2x
      #
      # IN THIS CI, the same switch made the job SLOWER. sovereign-ci.yml sets
      # NEXTEST_TEST_THREADS=4 in a container given `--cpus 8`, while `cargo test`
      # defaults to available parallelism — 8. Halving the workers while paying a
      # process spawn per test loses more than isolation wins: measured on this very
      # PR, 9,047 of 21,536 tests after 11 minutes of running, against 20.5 minutes
      # for the whole suite under `cargo test`. The 12.2x is real and unreachable
      # here until that cap is raised (PMAT-1315).
      #
      # The durable win from this ticket needed no switch at all: two tests were
      # building an index over the whole repository, 160s each, and are now 0.01s —
      # 320 seconds off this job AND off `ci / coverage`, which runs them serially.
      use_nextest: false
      # PMAT-1317 — the coverage gate stops being theater.
      #
      # `Enforce coverage floor` is skipped entirely unless coverage_min is set, so
      # until now ci / coverage spent ~29 minutes on every pull request measuring a
      # number that gated nothing. Setting it turns the step on: it derives line
      # coverage from the lcov.info the step above already produced (no extra
      # compile, no extra test run) and fails the job below max(coverage_min,
      # .pmat/coverage-baseline.txt).
      #
      # MEASURED on this tree with `cargo llvm-cov nextest --lib`: 85.25% of lines
      # (85.56% of regions; 297,741 lines, 43,919 uncovered), in 469s.
      #
      # The operator's standing target is 95%. It is NOT set here, because 85.25%
      # is 29,000 lines short of it and a gate that is red the day it lands is a
      # gate someone disables (§5.4). 80 is a floor this tree clears today and
      # would still notice a five-point collapse — a gate that can fail is the
      # whole point. The ratchet proper lands next: this PR's own coverage job
      # prints the number CI measures (lcov DA records, a different denominator
      # from the one above — which is exactly why the baseline is taken from CI's
      # measurement and not from mine), and that number becomes
      # .pmat/coverage-baseline.txt, after which the floor can only rise. PMAT-1317
      # carries the climb to 95%.
      coverage_min: '80'
      # The ratchet. The gate's default path is .pmat/coverage-baseline.txt, and
      # this repository gitignores **/.pmat/ — a baseline written there would
      # never reach CI, and the "ratchet" would silently be coverage_min alone.
      # Git cannot re-include a file under an ignored directory, so the file
      # lives at the root. Its number is what THE GATE'S OWN arithmetic reads
      # (hit DA records / total DA records from lcov.info), measured on this
      # tree: 85.43% (244,949/286,728) — not llvm-cov's summary, which reads
      # 85.25% over a different denominator. The effective floor is
      # max(coverage_min, this file); it may only rise (PMAT-1317).
      #
      # MEASURED JITTER: the same Rust, two consecutive runs, read 85.57% and
      # 85.56% (245,585 vs 245,583 lines of 287,014) — timing-dependent
      # branches move a handful of lines per run. A baseline set to the exact
      # last reading fails the very next run on noise, which is what happened
      # on this PR. So the file holds the measured value minus a jitter margin
      # of ~0.07 points (ten times the observed swing), and a raise is taken
      # only when a run clears the new value by that margin.
      coverage_baseline_file: '.coverage-baseline.txt'
    secrets: inherit

  # Top-level gate satisfies the org ruleset "Green Main" which requires a
  # status check named exactly `gate`. Reusable-workflow jobs always render
  # as `ci / gate`; rulesets need an unprefixed top-level job to match.
  #
  # `if: always()` here is NOT a swallow: this job exists precisely so that a
  # skipped or cancelled dependency still produces a verdict. Every result it
  # depends on is checked explicitly below, and anything that is not literally
  # `success` exits 1 — so `always()` converts "the check never reported" into
  # a red gate rather than a missing one.
  gate:
    # Roll-up only (reads results, no checkout): the gate-light pool, hosted for fork PRs.
    runs-on: ${{ (startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","gate-light"]') }}
    timeout-minutes: 15
    needs: [ci, windows-check, reusable-pin-drift, roadmap-validate, traceability, tdg-ratchet]
    if: ${{ always() && github.event.pull_request.draft != true }}
    steps:
      - name: Check required jobs
        env:
          HEAVY: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'train/') || startsWith(github.head_ref, 'batch/') || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          rc=0
          for j in "ci:${{ needs.ci.result }}" \
                   "windows-check:${{ needs.windows-check.result }}" \
                   "reusable-pin-drift:${{ needs.reusable-pin-drift.result }}" \
                   "roadmap-validate:${{ needs.roadmap-validate.result }}" \
                   "traceability:${{ needs.traceability.result }}" \
                   "tdg-ratchet:${{ needs.tdg-ratchet.result }}"; do
            name=${j%%:*}
            result=${j#*:}
            # infra#3828: windows-check is a HEAVY leg. On an ordinary PR it is skipped and
            # reported NOT MEASURED, never as a pass; on every other event skipped is red.
            if [ "$name" = "windows-check" ] && [ "$result" = "skipped" ] && [ "$HEAVY" != "true" ]; then
              echo "$name: NOT MEASURED on this PR (owed on train/*, batch/*, full-ci and every non-PR event)"
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "$name failed: $result"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then
            exit 1
          fi
          echo "All required jobs passed"

  # PMAT-674: docs/roadmaps/roadmap.yaml is the data every `pmat work` command
  # trusts, and `pmat work validate` 3.37.0 printed "Validation passed" on a
  # roadmap that carried PMAT-654 twice (#1194). A validator whose verdict
  # reaches nothing is a warning, so this job is in `gate`'s `needs` AND in its
  # result loop: a red roadmap fails the required `ci / gate` check.
  #
  # It runs the validator FROM THIS TREE, not the published crate (which is the
  # old code), and first proves the validator can fail: a fixture with a
  # duplicated id must exit 1, or the gate is measuring nothing. Exit codes are
  # documented in `pmat work validate --help`: 0 valid, 1 invalid or unreadable.
  # infra#3828 build audit: pmat is compiled ONCE per push. The three jobs below
  # used to run `cargo build --bin pmat` each; they now download this binary.
  # A failed build fails all three (a skipped job is not accepted by `gate`).
  build-pmat:
    if: ${{ github.event.pull_request.draft != true }}
    name: build pmat (once per push)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: build pmat from this tree
        run: cargo build --bin pmat --locked
      - uses: actions/upload-artifact@v7
        with:
          name: pmat-bin
          path: target/debug/pmat
          if-no-files-found: error
          retention-days: 1

  roadmap-validate:
    if: ${{ github.event.pull_request.draft != true }}
    name: roadmap validates
    needs: build-pmat
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: fetch the pmat built once for this push (build-pmat)
        uses: actions/download-artifact@v8
        with:
          name: pmat-bin
          path: target/debug
      - run: chmod +x target/debug/pmat
      - name: control — a duplicated id must be refused (exit 1)
        shell: bash
        run: |
          set -uo pipefail
          f=$(mktemp -d)
          mkdir -p "$f/docs/roadmaps"
          printf 'roadmap_version: "1.0"\nroadmap:\n  - id: PMAT-001\n    title: a\n    status: planned\n  - id: PMAT-001\n    title: b\n    status: planned\n' > "$f/docs/roadmaps/roadmap.yaml"
          if ./target/debug/pmat work validate --path "$f"; then
            echo "::error::pmat work validate exited 0 on a duplicated id — this gate cannot fail; fix the validator before trusting it"
            exit 1
          fi
          echo "control: a duplicated id is refused"
      - name: pmat work validate (0 = valid, 1 = invalid or unreadable)
        run: ./target/debug/pmat work validate

  # PMAT-636: CB-200's `[tdg] baseline` (.pmat-gates.toml) is a ratchet on how many
  # definitions grade below A, and until this job nothing that decides a merge
  # measured it. `the_committed_baseline_is_the_measured_count` reads
  # `.pmat/context.db`; a CI checkout has none, so under `ci / gate`'s
  # `cargo test --lib` it took its no-index branch and PASSED on every pull request
  # while master drifted from the banked 1688 to 1741 — measured with ONE pmat
  # binary over cold indexes of 683d6994d and ce945d81e, so new debt, not grader
  # drift. The `Ladder gate — pmat comply` step runs CB-200 too, but with
  # continue-on-error, so its red reached nothing.
  #
  # This job asks CB-200 itself, which indexes a fresh checkout OUTSIDE it (#1008),
  # and scripts/cb200-ratchet-gate.sh passes exactly one outcome: measured, and
  # equal to the recorded baseline. Over it, under it and not banked, stale, not
  # measured, or disagreeing with .pmat-gates.toml are each exit 1 and named. It
  # is in `gate`'s `needs` AND in its result loop, so a red verdict fails the
  # required check. CONTROL FIRST, as roadmap-validate does: every verdict is
  # planted, including a real pmat run over one definition planted below grade A,
  # and must be reached before the verdict on this tree is believed.
  tdg-ratchet:
    if: ${{ github.event.pull_request.draft != true }}
    name: CB-200 ratchet measured
    needs: build-pmat
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: fetch the pmat built once for this push (build-pmat)
        uses: actions/download-artifact@v8
        with:
          name: pmat-bin
          path: target/debug
      - run: chmod +x target/debug/pmat
      - name: control — every CB-200 verdict is reachable, and a planted below-A definition is refused
        run: bash scripts/cb200-ratchet-gate.sh ./target/debug/pmat --control
      - name: CB-200 is measured and equals the recorded baseline
        run: bash scripts/cb200-ratchet-gate.sh ./target/debug/pmat

  # PMAT-719 (goal-mode.md §7.1, step 2 of §11): the first CB rule wired into
  # the required `gate` context OUTSIDE the `Ladder gate — pmat comply` step,
  # which is `continue-on-error` and has been red on pre-existing failures for
  # long enough that its 157 rules are all NEUTERED. This job carries exactly
  # the rules it names with `--checks` (PMAT-718) — an id no rule provides is
  # a hard error there, so a typo cannot select nothing and go green — and it
  # sits in `gate`'s `needs` AND in its result loop, so a red verdict fails the
  # required check. `pmat comply ledger` attributes the run to the named rules.
  #
  # CB-2113: every non-merge commit a pull request adds carries a
  # `Pmat-Ticket:` trailer naming a real, non-terminal roadmap item. On a push
  # to master the rule reports not_applicable with the measured count (§8.4:
  # master is not judged until merges are restricted to merge commits). The
  # rule is offline — git and the roadmap file — so it needs no token and runs
  # on fork pull requests too.
  #
  # CONTROL FIRST, as roadmap-validate does: the gate is run against fixtures
  # planted with the defect it exists to catch, and must go RED there before
  # its GREEN on this tree is believed. `fetch-depth: 0` + `fetch-tags` because
  # the rule reads `merge-base` against the base branch and the latest `v*` tag.
  traceability:
    if: ${{ github.event.pull_request.draft != true }}
    name: traceability
    needs: build-pmat
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: fetch the pmat built once for this push (build-pmat)
        uses: actions/download-artifact@v8
        with:
          name: pmat-bin
          path: target/debug
      - run: chmod +x target/debug/pmat
      - name: control — a commit with no Pmat-Ticket trailer must be refused (exit 1)
        run: bash scripts/traceability-control.sh ./target/debug/pmat
      - name: control — an open item naming a closed issue must be refused (CB-2115, exit 1)
        run: bash scripts/roadmap-coherence-control.sh ./target/debug/pmat
      - name: control — pmat work sync --check-only can fail, can pass, and plans every write
        run: bash scripts/work-sync-control.sh ./target/debug/pmat
      - name: control — an open item with no issue, and one with no release:, must be refused (CB-2112, CB-2114, exit 1)
        run: bash scripts/ticket-release-control.sh ./target/debug/pmat
      - name: control — an active spec with no epic must be refused (CB-2110, exit 1)
        run: bash scripts/spec-epic-control.sh ./target/debug/pmat
      - name: control — an active spec with no current review must be refused (CB-2111, exit 1)
        run: bash scripts/spec-review-control.sh ./target/debug/pmat

      # PMAT-900001 (contracts/pmat-issue-closure-v1.yaml). An issue closes when a merged PR
      # body carries its own Closes line, and in no other way pmat starts. The gate plants a
      # closer call, a gh argv, a script, a Rust const, a renamed definition and an empty tree
      # in scratch repositories and must see each RED before its verdict on this tree is read.
      # `make gate` runs this step verbatim (scripts/gate.sh row `issue-closure`).
      - name: control — no pmat code path can close a GitHub issue (PMAT-900001)
        run: bash scripts/issue-closure-gate.sh ./target/debug/pmat --self-test && bash scripts/issue-closure-gate.sh ./target/debug/pmat
      # The PR's LIVE title and body, read through gh when the step runs: a body edited after
      # the event is judged as it is now on a re-run. ci.yml does not trigger on `edited`;
      # pr-checks.yml re-runs the same lint there.
      - name: a PR title and body close only what their own Closes lines name (PMAT-900001)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/pr-body-closing-lint.sh --self-test && bash scripts/pr-body-closing-lint.sh --pr "$PR_NUMBER"

      # PMAT-1313. The fast PR lane is a claim about what still runs; this is the
      # arm set that makes the claim falsifiable. It reads files only — no build,
      # no binary — so it costs the job nothing.
      - name: PR lane control
        run: bash scripts/pr-lane-control.sh

      # PMAT-1329 acceptance criterion 1: the tree stays clean after the suite runs,
      # "proven by a check that runs the suite and asserts the tree is clean rather
      # than by reading the tests". A test that writes to the repository was dormant
      # for as long as the tests reaching it did not compile; this is what notices
      # the next one. Arm 2 plants a write and requires the checker to see it, so a
      # checker that has stopped looking fails here rather than passing quietly.
      # PRE-RELEASE LANE ONLY. Arm 1 runs the full `cargo test --lib`, so on a pull
      # request this would be the suite a second time — exactly the duplication the
      # 80/20 mandate exists to remove (goal-mode.md §7.3). A push to master is the
      # thorough lane, and a test that writes to the repository is caught there
      # before it can reach anyone's desk.
      # The falsifiers first, on EVERY event: a checker that has stopped looking is
      # caught in a second, on a pull request, where someone can fix it.
      - name: the tree-cleanliness checker can still detect a write
        run: bash scripts/tests-dont-write-control.sh --self-test

      # Then the expensive arm, on the PRE-RELEASE lane only. It runs the full
      # `cargo test --lib`, so on a pull request this would be the suite a second
      # time — the duplication the 80/20 mandate exists to remove (goal-mode.md
      # §7.3). A push to master is the thorough lane.
      - name: the test suite does not write to the repository (pre-release lane)
        if: github.event_name == 'push'
        run: bash scripts/tests-dont-write-control.sh
      - name: "the closed loop holds (CB-2113, offline - git and the roadmap file)"
        run: ./target/debug/pmat comply check --checks CB-2113
      # CB-2115 judges LIVE repo-wide GitHub state, not this PR's diff, so one closed issue
      # anywhere reddened every PR (5 times in 24 h). It stays on the merge path for the
      # changes it is about: on a pull request or merge group it runs when the diff touches
      # docs/roadmaps/roadmap.yaml; on push it always gates master; roadmap-orphan-sweep.yml
      # runs it hourly and opens one ticket on red.
      - name: does this change touch the roadmap (CB-2115 scope)
        id: roadmap_scope
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "touched=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}"
          if [ -z "$base" ]; then echo "touched=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$base"...HEAD | grep -qx 'docs/roadmaps/roadmap.yaml'; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi
      - name: the roadmap and GitHub agree (CB-2115, push or roadmap-touching change)
        if: steps.roadmap_scope.outputs.touched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./target/debug/pmat comply check --checks CB-2115
      # History: CB-2115 joined this step on PMAT-723, in the order goal-mode.md §5.4 sets: the
      # sync reported (PMAT-720), the thirteen items naming #612 were resolved under
      # their own ticket (PMAT-721), the orphans were triaged and fixed by the sync's
      # own fixers (PMAT-1253), and `pmat work sync --check-only` measured 0 findings on
      # master before this step was added (docs/audits/impl-PMAT-723-receipt.md). It
      # reads live GitHub through GH_TOKEN. Tolerance is zero (§5.1): an open issue that
      # no open item names turns it red until `pmat work sync --direction github-to-yaml`
      # adds the item, and an open item naming a closed issue until the item is closed.
      # The env is block-style on purpose: a flow mapping cannot hold `${{ }}`.
      # CB-2112 and CB-2114 (PMAT-724, step 5) are withheld for the same reason. At
      # PMAT-724's measurement (2026-09-10) docs/roadmaps/roadmap.yaml on master has
      # 63 open items, 0 carrying release:, 0 whose numeric tail is an open issue
      # (50 name no issue, 13 name #612); the branch carrying steps 1-5's tickets
      # has 72, 0, 0 (59, 13). The control above proves both rules discriminate on
      # every arm, so the ledger lists them NEUTERED, which is the truth. They join
      # the step once the fixers have run and every open item has been re-minted
      # from its issue and bound to an open milestone (PMAT-725, after PMAT-723):
      #     run: ./target/debug/pmat comply check --checks CB-2112,CB-2113,CB-2114,CB-2115
      # CB-2110 (PMAT-728, step 6) is withheld too. At PMAT-728's measurement
      # (2026-09-10) every one of the 44 specs under docs/specifications carries
      # front-matter that parses and reads `epic: null`, and the three issues
      # labelled epic (#1017, #1018, #1019) have 0 sub-issues: the epics the specs
      # would name do not exist. The control above proves the rule discriminates on
      # every arm (its arm 16 runs the rule on THIS tree's specs and asserts NO-EPIC
      # on all of them — the flip cannot happen unnoticed), so the ledger lists
      # CB-2110 NEUTERED. It joins the step once a human has created one epic per
      # active spec, added the tickets' issues as its sub-issues, filled `epic:`,
      # and marked the historical and superseded specs (PMAT-729):
      #     run: ./target/debug/pmat comply check --checks CB-2110,CB-2112,CB-2113,CB-2114,CB-2115
      # CB-2111 (PMAT-1299, step 7) is withheld for the same reason. At PMAT-1299's
      # measurement (2026-09-11) none of the 44 active specs under docs/specifications
      # has a review artifact (docs/audits/spec-<slug>-review.json), so the rule reads
      # 44 NO-REVIEW. The control above proves it discriminates on every arm (its
      # this-tree arm runs the rule on THIS tree's specs and asserts NO-REVIEW on every
      # active one, so the flip cannot happen unnoticed), and the ledger lists CB-2111
      # NEUTERED. It joins the step once every active spec carries a review recorded
      # with `pmat spec review --record` (PMAT-1300):
      #     run: ./target/debug/pmat comply check --checks CB-2110,CB-2111,CB-2112,CB-2113,CB-2114,CB-2115

  # Two consumers of one reusable workflow on two different refs is drift, and
  # what it silently drifts is the GATES.
  #
  # This repo ran exactly that for five months. `nightly-bench.yml` called
  # sovereign-ci.yml@a6c9ab522 under the annotation `# main` — a ref it stopped
  # being on 2026-03-26 — while this file tracked `@main`. Every "this gate
  # could not fail" fix landed upstream in between reached `ci` and not the
  # nightly, which runs the SAME suite (test, lint, coverage, security, bench,
  # gate; ~1 h of clean-room runner time) every night. At the stale pin, three
  # were missing: clippy's step terminated its `||` chain in `echo` so it exited
  # 0 however clippy exited; the format check was suppressed twice (`|| echo`
  # AND `continue-on-error`); and the `gate` job read only `test` and `lint` —
  # `coverage` and `security` sat in its `needs` unexamined — comparing against
  # the literal string "failure", so a CANCELLED job passed. See the comment on
  # nightly-bench.yml for the measurements.
  #
  # Nothing detects this on its own, because both files are individually
  # well-formed: the defect is only visible in the RELATION between them. So
  # compare them. The rule is deliberately about agreement, not about SHA
  # pinning — pinning every consumer to one SHA passes; this repo's own tree at
  # the fix commit passes; and a tree where the pattern matches nothing FAILS,
  # because "we found no references" must never render as "the references
  # agree".
  #
  # Verified in all four directions before landing, by running this exact
  # script against copies of this workflow directory:
  #   fixed tree (ci.yml + nightly-bench.yml both @main)        -> exit 0
  #   pre-fix tree (nightly-bench.yml back on a6c9ab522)        -> exit 1
  #   both consumers pinned to the same SHA                     -> exit 0
  #   a workflow dir with no reusable `uses:` at all            -> exit 1
  #
  # In `gate`'s `needs`, so the verdict reaches the required `ci / gate`
  # context. A check that reports and cannot block is not a check.
  reusable-pin-drift:
    if: ${{ github.event.pull_request.draft != true }}
    name: reusable workflow pins agree
    runs-on: ${{ (startsWith(github.event_name, 'pull_request') && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted","gate-light"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: every reusable workflow is referenced at exactly one ref
        shell: bash
        run: |
          set -uo pipefail
          refs_file=$(mktemp)
          trap 'rm -f "$refs_file"' EXIT

          grep -hoE '^[[:space:]]*uses:[[:space:]]*[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+/\.github/workflows/[A-Za-z0-9_.-]+@[A-Za-z0-9_.-]+' \
            .github/workflows/*.yml \
            | sed -E 's/^[[:space:]]*uses:[[:space:]]*//' \
            | sort -u > "$refs_file"

          total=$(wc -l < "$refs_file")
          # Under-discovery is a finding, not a pass. If the pattern stops
          # matching — a renamed directory, a reformatted `uses:` line — this
          # step must say so rather than certify a tree it never looked at.
          if [ "$total" -lt 1 ]; then
            echo "::error::no reusable-workflow 'uses:' reference matched in .github/workflows/ — this check is measuring nothing, fix the pattern"
            exit 1
          fi
          echo "$total distinct reusable-workflow reference(s) found:"
          sed 's/^/  /' "$refs_file"

          rc=0
          while read -r path; do
            n=$(grep -c "^${path}@" "$refs_file")
            if [ "$n" -gt 1 ]; then
              echo "::error::${path} is referenced at ${n} different refs by this repo's workflows:"
              grep "^${path}@" "$refs_file" | sed 's/^/    /'
              echo "    Pin every consumer to the same ref, in one commit. A stale ref freezes that consumer's GATES, not just its behaviour."
              rc=1
            fi
          done < <(sed -E 's/@[A-Za-z0-9_.-]+$//' "$refs_file" | sort -u)

          if [ "$rc" -ne 0 ]; then
            exit 1
          fi
          echo "every reusable workflow is referenced at exactly one ref"

  # GH #625: `cargo install pmat` was broken on Windows for every published
  # version, because no CI leg ever compiled for it — aprender's default `cli`
  # feature pulled in aprender-profile, which does not build there, and all four
  # Unix legs stayed green throughout.
  #
  # PROMOTED to a blocking check (was `continue-on-error: true` and absent from
  # `gate`'s `needs`, which is the "verdict reaches nothing" defect: a Windows
  # break would have re-shipped GH #625 under a green tick). The comment here
  # said "promote it once it has been green for a few runs"; that condition is
  # met and was measured before flipping it — the last 12 runs of this workflow
  # (32494215902 … 32564647489, master and PR branches, 2026-08-21/22) all
  # report `windows-check` success, with the job taking 3–7 minutes against a
  # 45-minute timeout. Verified from the logs, not from the API: a job carrying
  # `continue-on-error` reports `conclusion: success` to
  # /actions/runs/{id}/jobs even when its step exited non-zero, so the API's
  # green is not evidence on its own.
  windows-check:
    # infra#3828: HEAVY. Runs on push, merge_group, schedule, dispatch, and on a pull request only
    # for a train/* or batch/* head or the full-ci label. On any other PR it is SKIPPED.
    if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'train/') || startsWith(github.head_ref, 'batch/') || contains(github.event.pull_request.labels.*.name, 'full-ci')) && github.event.pull_request.draft != true }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --bin pmat (default features)
        run: cargo check --bin pmat --locked

  # infra#3828 (operator ruling 2026-11-10 16:50Z): mutation testing runs in a scheduled nightly
  # workflow and nowhere else. The post-merge `mutants` job that lived here ran on every push to
  # master and is removed; the nightly run is .github/workflows/mutation-diff.yml.
