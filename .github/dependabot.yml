version: 2
updates:
  - package-ecosystem: "cargo"
    # Root workspace manifest. server/ was flattened to the repo root, so the
    # old "/server" path no longer existed and cargo updates were silent no-ops.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 2
    ignore:
      # prettyplease 0.3 is the `syn` 3.0 line. pmat is on `syn` 2, so the bump
      # puts two incompatible `syn` versions in the graph and
      # `prettyplease::unparse(file)` stops accepting our `syn::File`:
      #
      #   error[E0308]: expected `syn::file::File`, found `syn::File`
      #   note: there are multiple different versions of crate `syn`
      #
      # This is not a dependabot fault and not fixable in the bump: it needs a
      # `syn` 2 -> 3 migration across 693 `syn::` uses in 83 files. Ignoring the
      # 0.3 line keeps that decision explicit and stops a PR that cannot pass
      # from being reopened weekly. Drop this entry as part of the migration.
      # See #1028.
      - dependency-name: "prettyplease"
        versions: [">=0.3.0"]
    groups:
      # ONE weekly grouped PR for every non-breaking cargo bump (minor + patch).
      # Solo dependency PRs are not allowed (trains of 5-8, NOAH-TRAINS-5to8):
      # the previous split into patch/tokio/test groups left aprender-db, uuid
      # and others as solo PRs. Major bumps (e.g. arrow 59 -> 60) stay their own
      # PR so a breaking change cannot sink the grouped one.
      cargo-weekly:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "pragmaticlabs/maintainers"
    
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "pragmaticlabs/maintainers"

  # Test fixtures under fixtures/ are static analysis inputs — their JS deps
  # (e.g. vitest -> esbuild) are never installed, executed, or shipped in the
  # pmat binary. Disable version-update PRs so they don't generate noise.
  # Note: this controls update PRs only; pre-existing security alerts on these
  # never-run lockfiles are dismissed as "not used" in the Dependabot UI.
  - package-ecosystem: "npm"
    directory: "/fixtures/typescript"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
