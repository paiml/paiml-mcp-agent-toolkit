# PMAT Build Performance Optimizations - Phase 1
# See: docs/specifications/build-performance-optimization-v1.0.md

[build]
# Use all available CPU cores
# Note: 0 is invalid, removed to use default (auto-detect)

[target.x86_64-unknown-linux-gnu]
# Use faster linker (mold via clang)
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[profile.dev]
# Optimize dependencies (but not our code) for faster builds
opt-level = 0          # Our code: unoptimized (fast compile)
debug = true
split-debuginfo = "unpacked"  # Faster on Linux

[profile.dev.package."*"]
# Dependencies: fully optimized (slower compile once, faster runtime)
opt-level = 3

[profile.release]
# Thin LTO for faster release builds (vs full LTO)
lto = "thin"
codegen-units = 1      # Better optimization
strip = true           # Strip debug symbols (smaller binary)

