# cargo-deny configuration
# Deployed from paiml/infra — do not edit manually.
# Spec: docs/specifications/unified-ci-pipeline.md

[graph]
targets = []
# TRUE, deliberately, and diverging from the paiml/infra default.
#
# With `all-features = false` cargo-deny resolves only the DEFAULT feature graph,
# so every optional-feature dependency is invisible to it. On this tree that hid
# three live advisories — including RUSTSEC-2023-0071, a vulnerability, reachable
# through `octocrab` behind the optional `github-api` feature. `cargo deny check`
# printed "advisories ok" while `cargo deny --all-features check` printed
# "advisories FAILED". pmat ships `--features full`, so the default graph is not
# the graph its users install.
#
# This is also why five of the `ignore` entries below were reported as
# `advisory-not-detected`: they name crates that only exist in the wider graph,
# so the file was already documenting dependencies the check could not see.
all-features = true
no-default-features = false

[advisories]
ignore = [
    # Unmaintained transitive deps with no available fix.
    # Reviewed 2026-03-26 — all are deep transitive, no direct usage.
    { id = "RUSTSEC-2024-0384", reason = "instant: transitive via web-time, no replacement available" },
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive via simba/nalgebra/parquet, use pastey when upstream migrates" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix: transitive via indicatif, no replacement available" },
    { id = "RUSTSEC-2025-0141", reason = "bincode: transitive, widely used, no drop-in replacement" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: transitive, no safe upgrade available" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5: transitive via ratatui, fixed in 0.16 but ratatui pins 0.12" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: transitive via tabled_derive→apr-cli→aprender, no replacement" },
    # Reviewed 2026-07-02 (MACS-000 bootstrap, #612) — all transitive via the
    # aprender 0.50 sovereign stack; fixes require upstream aprender releases.
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: unmaintained, transitive via validator_derive→validator→apr-cli; no safe upgrade available" },
    # Reviewed 2026-08-19 — surfaced by turning `all-features` on above; all
    # three were always in the shipped `--features full` graph, and none was
    # visible to the default-graph check. cargo-deny reports "No safe upgrade is
    # available!" for each.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack: transitive via jsonwebtoken→octocrab. The timing sidechannel requires RSA PRIVATE-KEY operations, which pmat never performs — github_client.rs builds Octocrab with `.personal_token()` or unauthenticated, never GitHub App JWT signing. No safe upgrade exists upstream." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, transitive via lopdf→pdf-extract, no safe upgrade available" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust: unmaintained, transitive via syntect, no safe upgrade available" },
    # Re-verified 2026-07-31 against Cargo.lock. The path changed: aprender-orchestrate
    # was removed as a dependency, and quick-xml now arrives only via
    # syntect -> plist, behind the opt-in `syntax-highlighting` feature (NOT default).
    # The version also moved 0.37.5 -> 0.39.4, which is still below the 0.41 fix.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.39.4 quadratic attr check: transitive via syntect->plist (opt-in syntax-highlighting only); fix needs quick-xml>=0.41 upstream; pmat parses no untrusted XML" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.39.4 NsReader allocation DoS: transitive via syntect->plist (opt-in syntax-highlighting only); fix needs quick-xml>=0.41 upstream; pmat parses no untrusted XML" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["paiml"]
