  ## STEP 11: GITHUB ACTIONS CI/CD (MANDATORY)

  **Create `.github/workflows/test.yml`:**

  ```yaml
  name: Test and Deploy Book

  on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3

        - name: Install Dependencies
          run: |
            cargo install mdbook
            cargo install mdbook-linkcheck

        - name: Test All Chapters
          run: make test-all-chapters

        - name: Validate Quality
          run: make validate

        - name: Build Book
          run: make build

        - name: Upload Test Results
          if: always()
          uses: actions/upload-artifact@v3
          with:
            name: test-results
            path: test-results/

    deploy:
      needs: test
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main'
      steps:
        - uses: actions/checkout@v3

        - name: Install mdBook
          run: cargo install mdbook

        - name: Build Book
          run: mdbook build

        - name: Deploy to GitHub Pages
          uses: peaceiris/actions-gh-pages@v3
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./book
  ```

  ## STEP 12: QUALITY GATES (BLOCKING)

  **Before ANY commit, verify:**

  ```bash
  # 1. All tests pass
  make test-all-chapters
  # Expected: ✅ X/X chapters passing (100%)

  # 2. Minimum pass rate achieved
  # Calculate: (passing_examples / total_examples) >= ${MIN_PASS_RATE}%

  # 3. No broken links
  make lint-markdown
  # Expected: ✅ All links valid

  # 4. No vaporware
  grep -r "coming soon\|not yet implemented\|TODO\|FIXME" src/
  # Expected: No matches (or only in properly marked sections)

  # 5. Quality tool analysis (if applicable)
  make dogfood
  # Expected: ✅ Quality grade B+ or higher

  # 6. Book builds successfully
  make build
  # Expected: ✅ Book built: book/index.html

  # 7. Local preview works
  make serve
  # Expected: Book accessible at http://localhost:3000
  ```

  ## STEP 13: ZERO VAPORWARE POLICY (CRITICAL)

  **NEVER document features that don't exist or don't work.**

  ❌ **WRONG** (Vaporware):
  ```markdown
  ### Example: Advanced Feature (Coming Soon)

  This feature will allow you to...
  (Documentation for unimplemented feature)
  ```

  ✅ **CORRECT** (Documented reality):
  ```markdown
  ### Example: Working Feature

  \`\`\`bash
  # This command was tested and works
  tool feature --flag value
  \`\`\`

  **Output:**
  \`\`\`
  (Actual output from running command)
  \`\`\`
  ```

  **If feature is planned but not implemented:**
  - Document in ROADMAP.md
  - Create GitHub issue
  - DO NOT include in main book content
  - Optional: Add to "Future Features" appendix with clear "NOT YET AVAILABLE" warning

  ## STEP 14: CROSS-REFERENCING (BEST PRACTICE)

  **Link related content extensively:**

  ```markdown
  As discussed in [Chapter 2: Core Concepts](ch02-00-core-concepts.md), we can...

  For more details, see:
  - [Recipe 3.5: Related Pattern](ch03-recipe-005.md)
  - [Appendix B: Command Reference](appendix-b-commands.md)

  **Prerequisites**: Readers should understand [Type Systems](ch01-03-types.md) before proceeding.
  ```

  ## STEP 15: DEPLOYMENT (PRODUCTION)

  ### GitHub Pages Deployment

  ```bash
  # Build book
  make build

  # Create gh-pages branch (first time only)
  git checkout --orphan gh-pages
  git reset --hard
  cp -r book/* .
  git add .
  git commit -m "docs: Deploy book to GitHub Pages"
  git push origin gh-pages --force

  # Return to main
  git checkout main

  # Enable GitHub Pages in repository settings
  # Source: gh-pages branch, / (root)
  ```

  ### Custom Domain (Optional)

  ```bash
  # Add CNAME file to book output
  echo "book.yourdomain.com" > book/CNAME

  # Update book.toml
  # site-url = "https://book.yourdomain.com/"
  # cname = "book.yourdomain.com"
  ```

  ## STEP 16: VERSION CONSISTENCY

  **Track tool version in all chapters:**

  ```markdown
  <!-- DOC_STATUS_START -->
  *Tool version: tool 1.2.3*
  <!-- DOC_STATUS_END -->
  ```

  **Update all chapters when tool version changes:**

  ```bash
  # Find all version references
  grep -r "Tool version:" src/

  # Update systematically
  # Add Makefile target:
  sync-version:
  	find src -name "*.md" -exec sed -i 's/tool [0-9.]*$$/tool 1.3.0/g' {} +
  ```

  ## STEP 17: COMMON BOOK ISSUES (FIXED PATTERNS)

  ### Issue 1: Broken Example Code

  **Problem**: Examples don't compile/run
  **Fix**: Test BEFORE documenting

  ```bash
  # RED phase
  bash tests/ch01/test_example.sh  # FAILS

  # GREEN phase (write working code)
  # Document only after test passes
  bash tests/ch01/test_example.sh  # PASSES
  ```

  ### Issue 2: Outdated Examples

  **Problem**: Tool evolved, examples broke
  **Fix**: Automated testing catches regressions

  ```yaml
  # GitHub Actions runs tests on every push
  # Catches breakage immediately
  ```

  ### Issue 3: Inconsistent Formatting

  **Problem**: Different example styles across chapters
  **Fix**: Use chapter template, enforce in review

  ### Issue 4: Missing Test Coverage

  **Problem**: Some examples untested
  **Fix**: Calculate pass rate, enforce minimum

  ```bash
  # Pass rate calculation in Makefile
  test-all-chapters:
  	@total=0; passed=0; \
  	for test in tests/**/*.sh; do \
  		total=$$((total + 1)); \
  		if bash "$$test"; then passed=$$((passed + 1)); fi \
  	done; \
  	rate=$$((passed * 100 / total)); \
  	if [ $$rate -lt ${MIN_PASS_RATE} ]; then \
  		echo "❌ Pass rate $$rate% below minimum ${MIN_PASS_RATE}%"; \
  		exit 1; \
  	fi
  ```

  ### Issue 5: Broken Internal Links

  **Problem**: Links to non-existent chapters
  **Fix**: mdbook-linkcheck catches this

  ```bash
  make lint-markdown  # Validates all links
  ```

  ### Issue 6: SATD Comments in Examples

  **Problem**: TODO, FIXME in code examples
  **Fix**: Pre-commit hook catches SATD

  ```bash
  # Pre-commit hook
  if grep -r "TODO\|FIXME\|HACK" src/; then
      echo "❌ SATD comments found - file GitHub issues instead"
      exit 1
  fi
  ```

  ## STEP 18: BOOK-SPECIFIC CLAUDE.MD

  **Create comprehensive CLAUDE.md for book:**

  ```markdown
  # CLAUDE.md

  ## Prime Directive

  **Generate correct documentation where every example works on first attempt. Quality is built-in, not bolted-on.**

  ## MANDATORY Development Approach (BLOCKING)

  ### A. Test-Driven Documentation (TDD)
  - **ALL work must be TDD**: Every example written test-first
  - **NO exceptions**: Documentation follows working code
  - **Immediate feedback**: Tests run continuously

  ### B. Quality Gates with ${QUALITY_TOOL}
  - **Minimum grade**: B+ required on all examples
  - **BLOCKING gate**: No commits without quality approval
  - **Automated**: Pre-commit hooks enforce standards

  ### C. ${MIN_PASS_RATE}% Pass Rate Mandatory
  - **Minimum pass rate**: ${MIN_PASS_RATE}% of all examples must pass
  - **Test coverage**: Every code example has automated test
  - **No partial examples**: All examples complete and working

  ## Quality Standards (BLOCKING)

  - Test Coverage: 100% of examples
  - Pass Rate: ≥${MIN_PASS_RATE}%
  - Link Validation: All links valid
  - SATD Count: 0
  - Vaporware: 0 unimplemented features documented
  - Build Success: mdBook builds without errors

  ## TDD Workflow (MANDATORY)

  1. Write test FIRST (RED phase)
  2. Write documentation with working example (GREEN phase)
  3. Update chapter status blocks
  4. Run quality gates
  5. Commit only when all tests pass
  ```

  ## TOYOTA WAY PRINCIPLES FOR BOOKS

  - **Jidoka (Built-in Quality)**: Automated tests prove examples work
  - **Andon Cord**: Stop immediately when examples break
  - **Genchi Genbutsu (Go & See)**: Test every example in real environment
  - **Kaizen**: Continuously improve documentation based on user feedback
  - **Zero Defects**: No broken examples in production book

  ## WORKFLOW SUMMARY FOR BOOKS

  1. **Setup**: mdBook structure + book.toml + SUMMARY.md
  2. **Test Infrastructure**: tests/ directory with chapter-based tests
  3. **TDD Loop**:
     - Write test (RED)
     - Write documentation with working example (GREEN)
     - Update status blocks
     - Validate quality
  4. **Quality Gates**: All tests pass, minimum pass rate, no vaporware
  5. **Build**: `make build` produces book/index.html
  6. **Deploy**: GitHub Actions → GitHub Pages
  7. **Version**: Track tool version in all chapters

  ## BOOK SUCCESS CRITERIA

  - ✅ All code examples tested before documenting
  - ✅ Minimum ${MIN_PASS_RATE}% pass rate achieved
  - ✅ SUMMARY.md complete and accurate
  - ✅ Chapter status blocks up to date
  - ✅ No vaporware (zero unimplemented features)
  - ✅ No SATD comments (TODO, FIXME, HACK)
  - ✅ All internal links valid
  - ✅ Book builds successfully with mdBook
  - ✅ Deployed to GitHub Pages
  - ✅ CI/CD pipeline green

  ## ERROR HANDLING FOR BOOKS

  **If tests fail**:
  ```bash
  # DON'T document the broken example
  # FIX the code first, then update documentation
  bash tests/ch01/test_example.sh  # MUST pass before documenting
  ```

  **If pass rate below minimum**:
  ```bash
  # Add more tests or fix broken examples
  # DO NOT lower the minimum pass rate
  make test-all-chapters  # Keep running until ≥${MIN_PASS_RATE}%
  ```

  This systematic approach ensures every technical book is:
  - Comprehensive (400-1000 pages)
  - Accurate (all examples tested)
  - Production-ready (deployed to GitHub Pages)
  - Professional quality (print-ready standards)
  - Zero defects (TDD prevents broken examples)

