name: book-documentation
description: Create and maintain technical book documentation with extreme rigor and test-driven validation
category: documentation
priority: critical
methodology: EXTREME TDD + Documentation-as-Code + mdBook Standards
extends: documentation
constraints:
  - must use mdBook format with book.toml
  - all code examples must be tested before documenting
  - minimum 90% pass rate for all examples
  - SUMMARY.md must be correct and complete
  - chapter status tracking mandatory
  - zero vaporware tolerance
  - no SATD comments allowed
variables:
  BOOK_TITLE: ""
  BOOK_TYPE: "tutorial"  # tutorial, cookbook, reference
  TARGET_PAGES: "400"
  MIN_PASS_RATE: "90"
  BUILD_TOOL: "mdBook"
  TEST_FRAMEWORK: "bash"
  QUALITY_TOOL: "pmat"
heuristics:
  - test every code example before documenting
  - maintain chapter status blocks
  - use consistent formatting across chapters
  - cross-reference related chapters
  - dogfood your own tools (if applicable)
  - deploy to production (GitHub Pages)
prompt: |
  Create professional technical book documentation following mdBook standards with EXTREME test-driven rigor.

  ## CRITICAL DIFFERENCES: Book vs Regular Documentation

  **Books are NOT README.md files**:
  - Sequential learning narrative (tutorial) OR self-contained recipes (cookbook)
  - 400-1000 pages of comprehensive content
  - mdBook build system with SUMMARY.md table of contents
  - Chapter-based organization with clear progression
  - Production deployment to GitHub Pages
  - Comprehensive test suite for ALL examples
  - Professional quality standards (print-ready)

  ## STEP 1: ANALYZE BOOK TYPE AND REQUIREMENTS

  Determine book type:

  **Tutorial Book** (like pmat-book, ruchy-book):
  - Sequential chapters building on each other
  - Progressive concept introduction
  - Teaching methodology focus
  - 400-600 pages
  - Chapter dependencies expected
  - Linear reading progression

  **Cookbook** (like ruchy-cookbook):
  - Self-contained recipes (15-20 per chapter)
  - Random-access problem/solution format
  - Minimal cross-dependencies
  - 1000 pages comprehensive reference
  - Practical application focus
  - Look-up oriented

  **Reference Manual** (like ruchy-cli-tools-book):
  - Comprehensive API documentation
  - Tool/command reference
  - Integration guides
  - 500-800 pages
  - Searchable content
  - Quick reference oriented

  ## STEP 2: SETUP BOOK INFRASTRUCTURE

  ### Create mdBook Structure

  ```bash
  # Install mdBook if needed
  cargo install mdbook
  cargo install mdbook-linkcheck

  # Initialize book
  mdbook init ${BOOK_TITLE}
  cd ${BOOK_TITLE}

  # Create directory structure
  mkdir -p src/{chapters,appendices}
  mkdir -p tests/{ch01,ch02,ch03}
  mkdir -p theme
  mkdir -p scripts
  mkdir -p .github/workflows
  ```

  ### Create book.toml Configuration

  ```toml
  [book]
  title = "${BOOK_TITLE}"
  authors = ["Your Name"]
  description = "Comprehensive guide to [TOPIC]"
  language = "en"
  multilingual = false
  src = "src"

  [build]
  build-dir = "book"
  create-missing = false  # Prevent accidental file creation

  [preprocessor.index]

  [preprocessor.links]

  [output.html]
  theme = "theme"
  default-theme = "rust"
  preferred-dark-theme = "coal"
  smart-punctuation = true
  mathjax-support = false
  copy-fonts = true
  additional-css = ["theme/custom.css"]
  additional-js = []
  git-repository-url = "https://github.com/YOUR_ORG/${BOOK_TITLE}"
  git-repository-icon = "fa-github"
  edit-url-template = "https://github.com/YOUR_ORG/${BOOK_TITLE}/edit/main/{path}"
  site-url = "https://YOUR_ORG.github.io/${BOOK_TITLE}/"

  [output.html.print]
  enable = true
  page-break = true

  [output.html.fold]
  enable = true
  level = 1

  [output.html.playground]
  editable = true
  copyable = true
  copy-js = true
  line-numbers = true

  [output.html.search]
  enable = true
  limit-results = 30
  teaser-word-count = 30
  use-boolean-and = true
  boost-title = 2
  boost-hierarchy = 1
  boost-paragraph = 1
  expand = true
  heading-split-level = 3
  copy-js = true
  ```

  ## STEP 3: CREATE SUMMARY.MD (TABLE OF CONTENTS)

  **CRITICAL**: SUMMARY.md is the source of truth for book structure.

  ### Tutorial Book Template

  ```markdown
  # Summary

  [The Book Title](title-page.md)
  [Foreword](foreword.md)
  [Introduction](introduction.md)

  ## Part I: Getting Started

  - [Chapter 1: Installation and Setup](ch01-00-installation.md)
    - [Installing Tool](ch01-01-installing.md)
    - [First Example (TDD)](ch01-02-first-example-tdd.md)
    - [Understanding Output](ch01-03-output.md)

  - [Chapter 2: Core Concepts](ch02-00-core-concepts.md)
    - [Concept 1](ch02-01-concept1.md)
    - [Concept 2](ch02-02-concept2.md)

  ## Part II: Advanced Topics

  - [Chapter 3: Advanced Feature 1](ch03-00-advanced.md)
  - [Chapter 4: Advanced Feature 2](ch04-00-advanced2.md)

  ## Conclusion

  - [Conclusion](conclusion.md)

  ## Appendices

  - [Appendix A: Installation Guide](appendix-a-installation.md)
  - [Appendix B: Command Reference](appendix-b-commands.md)
  - [Appendix C: Troubleshooting](appendix-d-troubleshooting.md)
  ```

  ### Cookbook Template

  ```markdown
  # Summary

  [The Cookbook Title](title-page.md)
  [Introduction](introduction.md)

  ## Chapter 1: Basic Patterns
  - [Recipe 1.1: Basic Task](ch01-recipe-001.md)
  - [Recipe 1.2: Common Pattern](ch01-recipe-002.md)
  - [Recipe 1.3: Best Practice](ch01-recipe-003.md)

  ## Chapter 2: Intermediate Techniques
  - [Recipe 2.1: Technique 1](ch02-recipe-001.md)
  - [Recipe 2.2: Technique 2](ch02-recipe-002.md)

  ## Chapter 3: Advanced Recipes
  - [Recipe 3.1: Complex Pattern](ch03-recipe-001.md)
  ```

  ## STEP 4: CHAPTER STATUS TRACKING (MANDATORY)

  **EVERY chapter must include status block at top:**

  ```markdown
  <!-- DOC_STATUS_START -->
  **Chapter Status**: ✅ 100% Working (5/5 examples)

  | Status | Count | Examples |
  |--------|-------|----------|
  | ✅ Working | 5 | Ready for production use |
  | ⚠️ Not Implemented | 0 | Planned for future versions |
  | ❌ Broken | 0 | Known issues, needs fixing |
  | 📋 Planned | 0 | Future roadmap features |

  *Last updated: 2025-11-16*
  *Tool version: ${BOOK_TITLE} 1.0.0*
  <!-- DOC_STATUS_END -->
  ```

  **Update status blocks after every change!**

  ## STEP 5: TEST-DRIVEN DOCUMENTATION (MANDATORY)

  **CRITICAL**: Code examples MUST be tested BEFORE documentation is written.

  ### Create Test Directory Structure

  ```bash
  # Chapter-based test structure
  tests/
  ├── ch01/
  │   ├── test_installation.sh
  │   ├── test_first_example.sh
  │   └── test_output_format.sh
  ├── ch02/
  │   ├── test_core_concepts.sh
  │   └── test_advanced_usage.sh
  └── common/
      ├── test_utils.sh
      └── setup.sh
  ```

  ### Test Script Template (MANDATORY FORMAT)

  ```bash
  #!/bin/bash
  # TDD Test: Chapter X - Feature Name
  # Tests ACTUAL tool behavior, not hypothetical examples
  # EXTREME TDD with NASA-style quality verification

  # Note: Using manual error handling instead of set -e for better test output

  echo "=== Testing Chapter X: Feature Name ==="

  PASS_COUNT=0
  FAIL_COUNT=0

  test_pass() {
      echo "✅ PASS: $1"
      PASS_COUNT=$((PASS_COUNT + 1))
  }

  test_fail() {
      echo "❌ FAIL: $1"
      FAIL_COUNT=$((FAIL_COUNT + 1))
  }

  # Verify tool is available
  if ! command -v tool &> /dev/null; then
      echo "❌ FATAL: tool binary not found in PATH"
      exit 1
  fi

  echo "Using tool version: $(tool --version)"

  # Test 1: Basic functionality
  echo "Test 1: Basic functionality validation"
  TEST_DIR=$(mktemp -d)
  cd "$TEST_DIR"

  # Create test environment
  cat > test_input.txt << 'EOF'
  Test content here
  EOF

  # Run actual tool command
  OUTPUT=$(tool analyze test_input.txt --format json 2>&1 | grep -A 10000 '^{')

  # Validate JSON output
  if echo "$OUTPUT" | jq -e '.summary' &> /dev/null; then
      RESULT=$(echo "$OUTPUT" | jq -r '.summary.status')
      if [ "$RESULT" == "success" ]; then
          test_pass "Basic functionality: Tool executed successfully"
      else
          test_fail "Basic functionality: Expected success, got: $RESULT"
      fi
  else
      test_fail "Basic functionality: Tool failed or produced invalid JSON"
  fi

  # Cleanup
  cd /
  rm -rf "$TEST_DIR"

  # Summary
  echo ""
  echo "=== Chapter X Test Summary ==="
  echo "Passed: $PASS_COUNT"
  echo "Failed: $FAIL_COUNT"

  if [ $FAIL_COUNT -eq 0 ]; then
      echo "✅ All tests passed! Chapter X VALIDATED"
      exit 0
  else
      echo "❌ Some tests failed - STOP THE LINE"
      exit 1
  fi
  ```

  ## STEP 6: TDD WORKFLOW (MANDATORY PROCESS)

  **DO NOT SKIP THESE STEPS:**

  1. **Write Tests First** (RED phase):
     ```bash
     # Create test file for chapter
     vim tests/ch01/test_installation.sh

     # Make executable
     chmod +x tests/ch01/test_installation.sh

     # Run - MUST FAIL initially
     bash tests/ch01/test_installation.sh
     # Expected: ❌ Tests fail (no documentation yet)
     ```

  2. **Write Documentation** (GREEN phase):
     ```bash
     # Write chapter content with working examples
     vim src/ch01-01-installing.md

     # Run tests - MUST PASS now
     bash tests/ch01/test_installation.sh
     # Expected: ✅ All tests passed
     ```

  3. **Update Status Blocks**:
     ```bash
     # Update chapter status to reflect test results
     # Update SUMMARY.md if needed
     ```

  4. **Validate Quality**:
     ```bash
     # Run all chapter tests
     make test-ch01

     # Run book quality checks
     make validate

     # Build book locally
     make build
     ```

  5. **Commit Only When Tests Pass**:
     ```bash
     git add src/ch01-01-installing.md tests/ch01/test_installation.sh
     git commit -m "docs: Add Chapter 1.1 - Installation

     - All examples tested and working
     - Test coverage: 100%
     - Pass rate: 5/5 (100%)
     - Status: ✅ Production ready"
     ```

  ## STEP 7: MAKEFILE AUTOMATION

  **Create comprehensive Makefile:**

  ```makefile
  .PHONY: all build serve test clean lint validate help

  all: validate build

  help:
  	@echo "${BOOK_TITLE} Development Commands:"
  	@echo ""
  	@echo "📚 BOOK OPERATIONS:"
  	@echo "  make build             - Build the book with mdBook"
  	@echo "  make serve             - Serve the book locally (port 3000)"
  	@echo "  make clean             - Remove all build artifacts"
  	@echo ""
  	@echo "🧪 TESTING OPERATIONS:"
  	@echo "  make test              - Test all code examples"
  	@echo "  make test-ch01         - Test Chapter 1 examples"
  	@echo "  make test-all-chapters - Run ALL chapter tests"
  	@echo ""
  	@echo "🎨 CODE QUALITY:"
  	@echo "  make lint              - Lint all code examples"
  	@echo "  make lint-markdown     - Validate markdown links"
  	@echo "  make dogfood           - Run tool analysis on book itself"
  	@echo "  make quality-gate      - Check quality gates"
  	@echo "  make validate          - Run ALL quality checks"
  	@echo ""

  install-deps:
  	@command -v mdbook >/dev/null 2>&1 || cargo install mdbook
  	@command -v mdbook-linkcheck >/dev/null 2>&1 || cargo install mdbook-linkcheck

  build: install-deps
  	@echo "📚 Building ${BOOK_TITLE}..."
  	@mdbook build
  	@echo "✅ Book built successfully: book/index.html"

  serve: install-deps
  	@echo "🌐 Serving ${BOOK_TITLE} at http://localhost:3000"
  	@mdbook serve --port 3000

  clean:
  	@rm -rf book/
  	@echo "✅ Build artifacts cleaned"

  # Test individual chapters
  test-ch01:
  	@echo "Testing Chapter 1..."
  	@bash tests/ch01/*.sh

  test-ch02:
  	@echo "Testing Chapter 2..."
  	@bash tests/ch02/*.sh

  # Test all chapters
  test-all-chapters:
  	@echo "Testing all chapters..."
  	@for dir in tests/ch*/; do \
  		echo "Testing $${dir}..."; \
  		for test in $${dir}*.sh; do \
  			bash "$$test" || exit 1; \
  		done \
  	done

  test: test-all-chapters
  	@echo "✅ All tests passed!"

  lint-markdown:
  	@mdbook build
  	@echo "✅ Markdown links validated"

  dogfood:
  	@${QUALITY_TOOL} analyze . --min-grade B+
  	@echo "✅ Quality gate passed"

  validate: test lint-markdown dogfood
  	@echo "✅ All quality checks passed!"
  ```

  ## STEP 8: CODE EXAMPLE FORMAT (MANDATORY)

  **Every code example must follow this structure:**

  ```markdown
  ### Example: Analyzing a Repository

  \`\`\`bash
  # CLI usage with clear comments
  tool analyze /path/to/repo --format json
  \`\`\`

  **Expected Output:**
  \`\`\`json
  {
    "files": 100,
    "lines": 5000,
    "languages": ["rust", "python"]
  }
  \`\`\`

  **Explanation:**
  - The `analyze` command scans the repository
  - `--format json` outputs structured data
  - Results include file count, line count, and detected languages

  **Common Issues:**
  - ❌ **Error**: "Repository not found"
    - **Solution**: Verify path exists and is a valid repository
  - ❌ **Error**: "Permission denied"
    - **Solution**: Check file permissions with `ls -la`
  ```

