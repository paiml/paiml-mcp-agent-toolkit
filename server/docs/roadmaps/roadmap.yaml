  acceptance_criteria: []
  phases: []
  subtasks: []
  estimated_effort: null
  labels:
  - ml-integration
  - olap
  - trueno-db
  - performance-issue
  notes: |
    **Progress (2025-11-22)**:
    - ✅ Task 5.1: Arrow adapter for Top-K (33 LOC thin adapter, 2/2 tests passing)
    - ✅ Task 5.4: Criterion benchmarks COMPLETE - CRITICAL FINDING
    - 🚫 Tasks 5.2/5.3: BLOCKED on trueno-db SQL support (https://github.com/paiml/trueno-db/issues/3)

    **⚠️ CRITICAL PERFORMANCE ISSUE (Task 5.4)**:
    Arrow backend is 2.5-4.2x SLOWER than heap baseline (opposite of 5-28x speedup target):
    - 1K rows: Heap 938ns vs Arrow 2.4µs → 2.5x slower
    - 10K rows: Heap 3.7µs vs Arrow 12.6µs → 3.4x slower
    - 100K rows: Heap 32µs vs Arrow 118µs → 3.7x slower
    - 1M rows: Heap 304µs vs Arrow 1.3ms → 4.2x slower

    **Root Cause**: Conversion overhead (Vec → RecordBatch → TopKSelection → RecordBatch → Vec)
    dominates any SIMD benefits. trueno-db TopKSelection doesn't provide expected acceleration.

    **Impact**: Current Arrow integration does NOT meet performance requirements.
    Tasks 5.2/5.3 implementation strategy needs revision. Need Bitonic Top-K in trueno-db.

    **Commits**:
    - 6b1683ef: feat(olap): Add trueno-db Arrow backend for Top-K selection
    - 6a2d3d6b: feat(bench): Add Top-K benchmarks for heap vs Arrow backends

    **Dependencies**:
    - trueno-db v0.2.1 (QueryBuilder API needed for Tasks 5.2/5.3)
    - Issue: https://github.com/paiml/trueno-db/issues/3
    - Need: Bitonic Top-K implementation in trueno-db for performance target
