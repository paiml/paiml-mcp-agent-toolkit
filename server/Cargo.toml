[package]
name = "pmat"
version.workspace = true
edition = "2021"
rust-version = "1.80.0"
authors = ["Pragmatic AI Labs"]
description = "PMAT - Zero-config AI context generation and code quality toolkit (CLI, MCP, HTTP)"
homepage = "https://paiml.com"
repository = "https://github.com/paiml/paiml-mcp-agent-toolkit"
license = "MIT OR Apache-2.0"
readme = "../README.md"
keywords = ["mcp", "code-analysis", "refactoring", "quality", "ai"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
exclude = ["*.log", "temp_*", "*.profraw", ".pmat-cache", "proptest-regressions"]

[dependencies]
# Async runtime
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "sync", "signal", "process"] }
tokio-util = "0.7"
async-trait = "0.1"

# Text similarity
levenshtein = "1.0"

# Serialization (pinned to avoid swc_common issue with serde::__private)
serde = { version = "=1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }

# Template engine
handlebars = { version = "6.3", default-features = false, features = ["string_helpers"] }

# MCP SDK - now core dependency for MCP server functionality
pmcp = { version = "1.4.2", features = ["full", "validation"] }

# Caching
lru = { version = "0.14", features = ["hashbrown"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"
tempfile = "3.8"

# Logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

# Utilities
sha2 = "0.10"
once_cell = "1.21"
lazy_static = "1.5"
semver = { version = "1.0", features = ["serde"] }
regex = { version = "1.11", features = ["perf"] }
chrono = { version = "0.4", features = ["serde"] }
globset = "0.4"
csv = "1.3"
hex = "0.4"
uuid = { version = "1.17", features = ["v4", "serde"] }
parking_lot = "0.12"
dirs = "6.0"
roaring = "0.10"
rand = "0.9"
rayon = "1.10"
git2 = { version = "0.20", default-features = false, features = ["https"] }

# CLI utilities
dialoguer = "0.11"
console = "0.15"
url = "2.5"

# Storage
sled = "0.34"
lz4_flex = "0.11"
# rocksdb = { version = "0.22", default-features = false, features = ["zstd"] }
bincode = "1.3"

# Async utilities
futures = "0.3"

# File watching for configuration hot-reload
notify = "8.0"

# CLI support
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "env"] }
num_cpus = "1.17"
serde_yaml = "0.9"

# AST parsing (always needed for accurate complexity analysis)
syn = { version = "2.0", features = ["full", "parsing", "visit", "extra-traits"] }
quote = { version = "1.0", optional = true }
proc-macro2 = { version = "1.0", optional = true }
walkdir = "2.5"
ignore = "0.4"
glob = "0.3"
toml = "0.8"
crossbeam-channel = "0.5"
# For TypeScript/JavaScript parsing (conditional) - use compatible versions
swc_ecma_parser = { version = "24.0", optional = true }
swc_common = { version = "14.0", optional = true }
swc_ecma_ast = { version = "15.0", optional = true }
swc_ecma_visit = { version = "15.0", optional = true }
# For Python parsing (conditional)
rustpython-parser = { version = "0.4.0", optional = true }
# For C/C++ parsing (conditional)
tree-sitter = { version = "0.22", optional = true }
tree-sitter-c = { version = "0.21", optional = true }
tree-sitter-cpp = { version = "0.22", optional = true }
tree-sitter-go = { version = "0.21", optional = true }
tree-sitter-java = { version = "0.21", optional = true }
tree-sitter-c-sharp = { version = "0.21", optional = true }
tree-sitter-kotlin = { version = "0.3", optional = true }
# For Ruchy language support
ruchy = { version = "3.31", optional = true }
logos = { version = "0.14", optional = true }
# For Kotlin parsing (conditional) - DISABLED due to tree-sitter version conflict
# tree-sitter-kotlin = { version = "0.3.8", optional = true }

# Language-specific analysis
cpp_demangle = { version = "0.4", optional = true }
gimli = { version = "0.32", optional = true }
goblin = { version = "0.10", optional = true }
# Analysis infrastructure for C/C++
fixedbitset = { version = "0.5", optional = true }
rustc-hash = { version = "2.1" }

# Installer generation
# installer-macro = { path = "../installer-macro" } # Removed - using simple include_str! instead
blake3 = { version = "1.8", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Demo/reporting mode dependencies (included by default)
webbrowser = "1.0"
bytes = "1.10"
http = "1.3"
httparse = "1.10"
dashmap = "6.1"
flate2 = "1.1"
smallvec = "1.15.0"

# Unified protocol support
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
capnp = "0.20"
capnpc = "0.20"
tower = { version = "0.5", default-features = false, features = ["util", "timeout"] }
tower-http = { version = "0.6", default-features = false, features = ["fs", "trace", "compression-gzip", "timeout", "cors"] }
hyper = { version = "1.6", default-features = false, features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "client"] }
http-body-util = "0.1"

# Graph analysis
petgraph = "0.8"

# Markdown parsing
pulldown-cmark = "0.13"

# HTTP client for GitHub API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Prometheus metrics
prometheus = "0.14"
warp = "0.3"

# Progress bars
indicatif = "0.17"

# Table formatting
prettytable-rs = "0.10"

# TUI support
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }
sys-info = "0.9.1"

# Storage backends
rocksdb = { version = "0.24", optional = true, default-features = false, features = ["lz4", "snappy"] }
wasmparser = "0.239.0"
shell-words = "1.1.0"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pretty_assertions = "1.4"
tempfile = "3.20"
criterion = { version = "0.6", features = ["html_reports"] }
proptest = "1.6"
quickcheck = "1.0"
quickcheck_macros = "1.0"
assert_cmd = "2.0"
predicates = "3.1"
scraper = "0.24"
serial_test = "3.2"

[build-dependencies]
ureq = "3.0"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
capnpc = "0.20"

[features]
default = ["all-languages", "demo"]
all-languages = ["rust-ast", "typescript-ast", "python-ast", "c-ast", "cpp-ast", "ruchy-ast", "go-ast", "wasm-ast", "shell-ast", "java-ast", "csharp-ast", "kotlin-ast"]
most-languages = ["rust-ast", "typescript-ast", "python-ast", "c-ast", "cpp-ast", "java-ast", "csharp-ast", "kotlin-ast"]
rust-only = ["rust-ast"]
ruchy-ast = ["ruchy", "logos"]
go-ast = ["tree-sitter", "tree-sitter-go"]
java-ast = ["tree-sitter", "tree-sitter-java"]
csharp-ast = ["tree-sitter", "tree-sitter-c-sharp"]
kotlin-ast = ["tree-sitter", "tree-sitter-kotlin"]
wasm-ast = []
shell-ast = []
skip-slow-tests = []
rust-ast = ["quote", "proc-macro2"]
typescript-ast = ["rust-ast", "swc_ecma_parser", "swc_common", "swc_ecma_ast", "swc_ecma_visit"]
python-ast = ["rust-ast", "rustpython-parser"]
c-ast = ["tree-sitter", "tree-sitter-c", "fixedbitset"]
cpp-ast = ["c-ast", "tree-sitter-cpp", "cpp_demangle", "gimli", "goblin"]
# kotlin-ast = ["tree-sitter", "tree-sitter-kotlin"] # DISABLED
# Feature to exclude demo/reporting functionality for minimal builds
demo = []
# TUI mode support
tui = ["ratatui", "crossterm"]
# Integration tests feature
integration-tests = []
# End-to-end tests feature
e2e-tests = []
# Performance tests feature
perf-tests = []
# RocksDB storage backend for high-performance TDG storage
rocksdb-backend = ["rocksdb"]


[[bin]]
name = "pmat"
path = "src/bin/pmat.rs"

# [[bin]]
# name = "generate-installer"
# path = "src/bin/generate-installer.rs"
# required-features = ["installer-gen"]

[[bench]]
name = "critical_path"
harness = false

[[bench]]
name = "performance"
harness = false

[[test]]
name = "unit_core"
path = "tests/unit/core.rs"
required-features = []

[[test]]
name = "services_integration"
path = "tests/integration/services.rs"
required-features = ["integration-tests"]

[[test]]
name = "protocol_adapters"
path = "tests/integration/protocols.rs"
required-features = ["integration-tests"]

[[test]]
name = "e2e_system"
path = "tests/e2e/system.rs"
required-features = ["e2e-tests"]

[[test]]
name = "performance_regression"
path = "tests/performance/regression.rs"
required-features = ["perf-tests"]

# Examples for deterministic MCP agents course
[[example]]
name = "scaffold_agent_basics"
path = "examples/scaffold_agent_basics.rs"

[[example]]
name = "scaffold_agent_interactive"
path = "examples/scaffold_agent_interactive.rs"

[[example]]
name = "scaffold_agent_hybrid"
path = "examples/scaffold_agent_hybrid.rs"

[[example]]
name = "scaffold_agent_course_project"
path = "examples/scaffold_agent_course_project.rs"

[[example]]
name = "similarity_demo"
path = "examples/similarity_demo.rs"

# Profile configuration moved to workspace root

[package.metadata.docs.rs]
# Use default features for documentation (which excludes python-ast due to malachite-bigint build issues)
features = ["default"]
# Set DOCS_RS environment variable to skip network operations
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
