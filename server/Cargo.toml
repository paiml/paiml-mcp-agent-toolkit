[package]
name = "pmat"
version.workspace = true
edition = "2021"
rust-version = "1.80.0"
authors = ["Pragmatic AI Labs"]
description = "PMAT - Zero-config AI context generation and code quality toolkit (CLI, MCP, HTTP)"
homepage = "https://paiml.com"
repository = "https://github.com/paiml/paiml-mcp-agent-toolkit"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "code-analysis", "refactoring", "quality", "ai"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
exclude = ["*.log", "*.profraw", ".pmat-cache", "proptest-regressions"]

[[bin]]
name = "pmat-agent"
path = "src/bin/pmat-agent.rs"

[dependencies]
# Organizational Intelligence Plugin - Phase 4 integration
organizational-intelligence-plugin = { version = "0.1", optional = true }

# Async runtime
# Sprint 46 Phase 4: Removed "io-std", "signal", "process" features (saves 180-280 KB)
# Note: Code refactored to use std::io, platform-specific signal handling, and std::process::Command
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"

# Actor framework
actix = "0.13"
actix-rt = "2.10"

# State management
rkyv = { version = "0.7", features = ["validation", "alloc"] }
zstd = "0.13"
memmap2 = "0.9"
# crdt = "0.5" # Too old, will implement our own

# Consensus
async-raft = "0.6"

# Message passing
# bytes = "1.10" # Already defined below
crossbeam = "0.8"
arc-swap = "1.7"

# Resource management
sysinfo = "0.32"
libc = "0.2"
num-traits = "0.2"

# Property testing
proptest = "1.6"
bolero = { version = "0.12", optional = true }

# Formal verification
kani-verifier = { version = "0.56", optional = true }

# Text similarity
levenshtein = "1.0"

# Machine Learning (Pure Rust - no C++ dependencies)
# Migration to aprender complete (Sprint 45)
# Graph algorithms enhanced (Sprint 46) - added 8 new centrality & structural stats
# See: docs/specifications/aprender-ml-integration.md
aprender = "0.7.0"  # PAIML next-gen ML (TDG 94.1/100, zero deps, SafeTensors support, comprehensive graph algorithms)

# High-Performance Compute (SIMD/GPU)
trueno = { version = "0.6.0", optional = true }
trueno-db = { version = "0.3.1", optional = true, default-features = false }
renacer = { version = "0.6.1", optional = true }  # Pure Rust system call tracer

# Analytics GPU dependencies (optional, gated by analytics-gpu feature)
# Issue #79: Feature-gated architecture to prevent +3.8 MB binary bloat
wgpu = { version = "24.0", optional = true, features = ["wgsl"] }
pollster = { version = "0.3", optional = true }  # Async runtime for wgpu
bytemuck = { version = "1.14", optional = true }  # Safe cast for GPU buffers
arrow = { version = "53", optional = true }  # Arrow columnar format (required for direct arrow API usage)
# Note: parquet is managed by trueno-db dependency

# Serialization (pinned to avoid swc_common issue with serde::__private)
serde = { version = "=1.0.219", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
rmp-serde = "1.3"  # MessagePack for .pmat recording format (Sprint 75)

# Template engine
handlebars = { version = "6.3", default-features = false, features = ["string_helpers"] }

# MCP SDK - now core dependency for MCP server functionality
# Sprint 46 Phase 4: Switched from "full" to explicit features (saves 150-250 KB)
pmcp = { version = "1.4.2", features = ["websocket", "http", "sse", "validation"] }

# Caching
lru = { version = "0.14", features = ["hashbrown"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"
tempfile = "3.8"

# Logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }

# Utilities
sha2 = "0.10"
once_cell = "1.21"
lazy_static = "1.5"
semver = { version = "1.0", features = ["serde"] }
regex = { version = "1.11", features = ["perf"] }
chrono = { version = "=0.4.38", features = ["serde"] }  # Pinned for arrow v53.4 compatibility
globset = "0.4"
csv = "1.3"
hex = "0.4"
uuid = { version = "1.17", features = ["v4", "serde"] }
parking_lot = "0.12"
dirs = "6.0"
roaring = "0.10"
rand = "0.9"
rayon = "1.10"
git2 = { version = "0.20", default-features = false, features = ["https"] }

# CLI utilities
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
url = "2.5"

# Storage
libsql = "0.9.24"  # Modern SQLite-compatible database (replacement for sled)
lz4_flex = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }  # TODO: Migrate turso_vector_db.rs to libsql (async API)
sled = { version = "0.34", optional = true }  # DEPRECATED: Unmaintained, kept for backward compat (opt-in only)
# rocksdb = { version = "0.22", default-features = false, features = ["zstd"] }
bincode = "1.3"

# Async utilities
futures = "0.3"

# GitHub API client (Issue #75: Unified GitHub/YAML workflow)
octocrab = "0.40"

# File watching for configuration hot-reload
notify = "8.0"

# CLI support
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "env"] }
num_cpus = "1.17"
serde_yaml = "0.9"

# AST parsing (always needed for accurate complexity analysis)
syn = { version = "2.0", features = ["full", "parsing", "visit", "extra-traits"] }
quote = { version = "1.0", optional = true }
proc-macro2 = { version = "1.0", optional = true }
walkdir = "2.5"
ignore = "0.4"
glob = "0.3"
toml = "0.8.23"
crossbeam-channel = "0.5"
which = "6.0"  # Sprint 70: Find cargo-mutants in PATH
# For TypeScript/JavaScript parsing (conditional) - use compatible versions
swc_ecma_parser = { version = "24.0", optional = true }
swc_common = { version = "14.0", optional = true }
swc_ecma_ast = { version = "15.0", optional = true }
swc_ecma_visit = { version = "15.0", optional = true }
# For Python parsing (conditional) - REMOVED: Migrated to tree-sitter-python
# rustpython-parser = { version = "0.4.0", optional = true }
# For C/C++ parsing (conditional)
tree-sitter = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-scala = { version = "0.20.0", optional = true }
# Sprint 46 Phase 5: Removed unused language parsers (1.25 MB release binary savings)
# tree-sitter-erlang = { version = "0.15", optional = true }
# tree-sitter-elixir = { version = "0.3", optional = true }
# tree-sitter-haskell = { version = "0.23", optional = true }
# tree-sitter-ocaml = { version = "0.23", optional = true }
# For Ruchy language support (Ruby alternative parser)
ruchy = { version = "3.115", optional = true }
logos = { version = "0.14", optional = true }
# For Kotlin parsing (conditional) - DISABLED due to tree-sitter version conflict
# tree-sitter-kotlin = { version = "0.3.8", optional = true }

# Language-specific analysis
cpp_demangle = { version = "0.4", optional = true }
gimli = { version = "0.32", optional = true }
goblin = { version = "0.10", optional = true }
# Analysis infrastructure for C/C++
fixedbitset = { version = "0.5", optional = true }
rustc-hash = { version = "2.1" }

# Installer generation
# installer-macro = { path = "../installer-macro" } # Removed - using simple include_str! instead
blake3 = { version = "1.8", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

# Demo/reporting mode dependencies (included by default)
webbrowser = "1.0"
bytes = "1.10"
http = "1.3"
httparse = "1.10"
dashmap = "6.1"
flate2 = "1.1"
smallvec = "1.15.0"

# Unified protocol support
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
# capnp = "0.20" # REMOVED: Unused Cap'n Proto serialization (0 references)
# capnpc = "0.20" # REMOVED: Unused Cap'n Proto compiler (0 references)
tower = { version = "0.5", default-features = false, features = ["util", "timeout"] }
# Sprint 46 Phase 4: Removed "fs" feature (no ServeDir/ServeFile usage, saves 40-70 KB)
tower-http = { version = "0.6", default-features = false, features = ["trace", "compression-gzip", "timeout", "cors"] }
# Sprint 46 Phase 4: Removed "client" feature (reqwest provides HTTP client, saves 80-120 KB)
hyper = { version = "1.6", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "client"] }
http-body-util = "0.1"

# Graph analysis
petgraph = "0.8"
nalgebra-sparse = "0.11"

# Markdown parsing
pulldown-cmark = "0.13"

# HTTP client for GitHub API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Prometheus metrics
prometheus = { version = "0.14" }
warp = { version = "0.3" }

# Table formatting
prettytable-rs = "0.10"

# TUI support
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.29", optional = true }
sys-info = "0.9.1"

# Storage backends
rocksdb = { version = "0.24", optional = true, default-features = false, features = ["lz4", "snappy"] }
wasmparser = "0.239.0"
shell-words = "1.1.0"
crc32fast = "1.5.0"
pest = "2.8.2"
pest_derive = { version = "2.8.2", features = ["default"] }

# Deep WASM inspection dependencies
wasm-encoder = "0.239.0"
# walrus = "0.22" # REMOVED: Unused (0 references in codebase)
object = "0.37"
sourcemap = "9.0"
ahash = "0.8"
prettyplease = "0.2.37"
workspace-hack = { version = "0.1", path = "../workspace-hack" }
fs2 = "0.4.3"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pretty_assertions = "1.4"
tempfile = "3.20"
assert_cmd = "2.0"      # CLI testing for PMAT-7001
predicates = "3.1"      # Assertion helpers for PMAT-7001
criterion = { version = "0.6", features = ["html_reports"] }
proptest = "1.6"
quickcheck = "1.0"
quickcheck_macros = "1.0"
serial_test = "3.2"
futures-test = "0.3"
actix-test = "0.1"
env_logger = "0.11.8"

[build-dependencies]
ureq = "3.0"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
# capnpc = "0.20" # REMOVED: Unused Cap'n Proto compiler

[features]
default = ["all-languages", "demo", "polyglot-ast", "org-intelligence", "tdg-explain", "analytics-simd", "mutation-testing"]
# Phase 2 Progress (2025-11-20):
# ✅ FIXED (commit b721a174): Module-level feature gates for unified_go_analyzer, unified_wasm_analyzer,
#    org_handlers, language_mapper (Java/Scala)
# ⚠️  REMAINING: Deeper conditional compilation issues in function bodies (TypeScript/SWC dependencies)
# TODO: Continue Phase 2 refactoring to enable minimal builds with reduced language support
org-intelligence = ["organizational-intelligence-plugin"]
all-languages = ["rust-ast", "typescript-ast", "python-ast", "c-ast", "cpp-ast", "ruchy-ast", "go-ast", "wasm-ast", "deep-wasm", "shell-ast", "php-ast", "swift-ast", "java-ast", "csharp-ast", "ruby-ast", "scala-ast"]
most-languages = ["rust-ast", "typescript-ast", "python-ast", "c-ast", "cpp-ast", "java-ast", "csharp-ast", "ruby-ast", "scala-ast", "go-ast", "shell-ast"]
# Note: go-ast and shell-ast kept in most-languages (unified_go_analyzer.rs now has proper feature gates)
rust-only = ["rust-ast"]
# Polyglot AST meta-feature for cross-language analysis
polyglot-ast = []
ruchy-ast = ["ruchy", "logos"]
go-ast = ["tree-sitter", "tree-sitter-go"]
java-ast = ["tree-sitter", "tree-sitter-java", "polyglot-java"]
csharp-ast = ["tree-sitter", "tree-sitter-c-sharp", "polyglot-csharp"]
kotlin-ast = ["tree-sitter", "tree-sitter-kotlin-ng", "polyglot-kotlin"]
ruby-ast = ["tree-sitter", "tree-sitter-ruby", "polyglot-ruby"]
scala-ast = ["tree-sitter", "tree-sitter-scala", "polyglot-scala"]

# Polyglot language-specific features
polyglot-java = ["polyglot-ast"]
polyglot-kotlin = ["polyglot-ast"]
polyglot-scala = ["polyglot-ast"]
polyglot-typescript = ["polyglot-ast"]
polyglot-javascript = ["polyglot-ast"]
polyglot-csharp = ["polyglot-ast"]
polyglot-ruby = ["polyglot-ast"]
# Sprint 46 Phase 5: Removed unused language feature definitions
# erlang-ast = ["tree-sitter", "tree-sitter-erlang"]
# elixir-ast = ["tree-sitter", "tree-sitter-elixir"]
# haskell-ast = ["tree-sitter", "tree-sitter-haskell"]
# ocaml-ast = ["tree-sitter", "tree-sitter-ocaml"]
wasm-ast = []
deep-wasm = ["gimli", "wasm-ast"]
shell-ast = []
php-ast = []
swift-ast = []
skip-slow-tests = []
internal_tests = []
rust-ast = ["quote", "proc-macro2", "tree-sitter", "tree-sitter-rust"]
typescript-ast = ["rust-ast", "swc_ecma_parser", "swc_common", "swc_ecma_ast", "swc_ecma_visit", "tree-sitter", "tree-sitter-typescript", "tree-sitter-javascript", "polyglot-typescript"]
python-ast = ["rust-ast", "tree-sitter", "tree-sitter-python"]
# ✅ Migration complete! All 5 files migrated from rustpython-parser to tree-sitter-python:
#   - tdg/analyzer_ast.rs (Phase 4)
#   - services/mutation/python_adapter.rs (Phase 5a)
#   - services/ast_python_compat.rs (Phase 5a)
#   - services/unified_python_analyzer.rs (Phase 5a)
#   - services/enhanced_python_visitor.rs (Phase 5b)
c-ast = ["tree-sitter", "tree-sitter-c", "fixedbitset"]
cpp-ast = ["c-ast", "tree-sitter-cpp", "cpp_demangle", "gimli", "goblin"]
# Feature to exclude demo/reporting functionality for minimal builds
demo = []
# JavaScript AST support
javascript-ast = ["typescript-ast", "polyglot-javascript"]
# TUI mode support
tui = ["ratatui", "crossterm"]
# Integration tests feature
integration-tests = []
# End-to-end tests feature
e2e-tests = []
# Performance tests feature
perf-tests = []
# RocksDB storage backend for high-performance TDG storage
rocksdb-backend = ["rocksdb"]
# Sled storage backend (deprecated - unmaintained, opt-in only for backward compat)
sled-backend = ["sled"]
# High-performance compute features (Trueno)
simd = ["trueno"]
gpu = ["trueno", "trueno/gpu"]

# Analytics features (Issue #79: Feature-gated architecture)
# Default: SIMD-only (7.8 MB, 18s compile, ≤30 transitive deps)
analytics-simd = ["trueno", "trueno-db", "trueno-db/simd", "arrow"]
# GPU-enabled: +wgpu (11.6 MB, 63s compile, ≤95 transitive deps)
# Note: arrow/parquet pulled in transitively via trueno-db/gpu
analytics-gpu = ["analytics-simd", "trueno-db/gpu", "wgpu", "pollster", "bytemuck"]

# TDG explain mode with function-level analysis (Issue #78)
# Uses tree-sitter-rust for custom function-level complexity analysis
tdg-explain = ["rust-ast"]

# Mutation testing (Phase 2 - Optional)
# Enables multi-language mutation testing with tree-sitter parsers
# Depends on all language ASTs used by mutation generators
mutation-testing = ["rust-ast", "python-ast", "typescript-ast", "cpp-ast", "go-ast"]


[[bin]]
name = "pmat"
path = "src/bin/pmat.rs"

# [[bin]]
# name = "generate-installer"
# path = "src/bin/generate-installer.rs"
# required-features = ["installer-gen"]

[[bench]]
name = "critical_path"
harness = false

[[bench]]
name = "performance"
harness = false

[[bench]]
name = "dead_code_ops"
harness = false

[[bench]]
name = "similarity_ops"
harness = false

[[bench]]
name = "tdg_ops"
harness = false

[[bench]]
name = "storage_backend_bench"
harness = false

[[bench]]
name = "claude_integration_bench"
harness = false

[[bench]]
name = "topk_selection"
harness = false

[[test]]
name = "unit_core"
path = "tests/unit/core.rs"
required-features = []

[[test]]
name = "services_integration"
path = "tests/integration/services.rs"
required-features = ["integration-tests"]

[[test]]
name = "protocol_adapters"
path = "tests/integration/protocols.rs"
required-features = ["integration-tests"]

[[test]]
name = "e2e_system"
path = "tests/e2e/system.rs"
required-features = ["e2e-tests"]

[[test]]
name = "performance_regression"
path = "tests/performance/regression.rs"
required-features = ["perf-tests"]

# Examples for deterministic MCP agents course
[[example]]
name = "scaffold_agent_basics"
path = "examples/scaffold_agent_basics.rs"

[[example]]
name = "scaffold_agent_interactive"
path = "examples/scaffold_agent_interactive.rs"

[[example]]
name = "scaffold_agent_hybrid"
path = "examples/scaffold_agent_hybrid.rs"

[[example]]
name = "scaffold_agent_course_project"
path = "examples/scaffold_agent_course_project.rs"

[[example]]
name = "similarity_demo"
path = "examples/similarity_demo.rs"

[[example]]
name = "context_analysis_demo"
path = "examples/context_analysis_demo.rs"

# Profile configuration moved to workspace root

[package.metadata.docs.rs]
# Use default features for documentation (which excludes python-ast due to malachite-bigint build issues)
features = ["default"]
# Set DOCS_RS environment variable to skip network operations
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "docsrs"]
