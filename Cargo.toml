# Profile configuration moved to workspace root

# ── Transport gate (release protocol) ──────────────────────────────────────
#
# Every interface this release ships, each naming the cargo TEST TARGET that
# spawns the SHIPPED BINARY. Three interfaces ship: the CLI, MCP over stdio
# (`MCP_VERSION=1 pmat`), and MCP over streamable HTTP (`pmat serve --transport
# http`, compiled only with `--features mcp-http`). There is no fourth: the
# other `--transport` values still exit 2 with "not yet implemented", and
# `pmat serve` is the only server entry point, so nothing else is declared here.
#
# Why the target NAME is load-bearing: `cargo test` silently EXCLUDES targets
# that carry `required-features`, so a bare run compiles none of the HTTP gate
# and still reports success — "covered" and "skipped" are indistinguishable.
# Naming the target turns absence into a hard failure:
#
#   cargo test --test e2e_cli_t
#   cargo test --test e2e_mcp_stdio_t
#   cargo test --test e2e_http_serve_t --features mcp-http   # exit 101 if missing
#
# Why each target must SPAWN the binary rather than call the library: in a
# sibling repo a four-way parity suite was green for months while the mcp and
# http servers had no caller from `main.rs` at all. The transports agreed with
# each other perfectly and were unreachable from the process entry point. Every
# target below therefore drives `env!("CARGO_BIN_EXE_pmat")` as a real process.
# `src/mcp_pmcp/http_server.rs::http_e2e_tests` binds a real socket but calls
# `serve()` directly, which is exactly the shape that failed to notice — it is
# a unit test of the transport, not a gate on its reachability.
[package.metadata.transports]
cli = { e2e = "e2e_cli_t" }
mcp = { e2e = "e2e_mcp_stdio_t" }
http = { e2e = "e2e_http_serve_t", features = ["mcp-http"] }

[package.metadata.cargo-machete]
# Every crate listed here IS used -- under a different identifier. Each sets a
# `[lib] name` that differs from its package name, and cargo-machete matches on
# the package name with dashes turned into underscores, so it cannot see the
# real import and reports a false positive.
#
# Verified against the 0.61.0 sources in ~/.cargo/registry/src; re-check the
# `[lib] name` field if a rename ever lands upstream.
ignored = [
    "aprender-compute",           # [lib] name = "trueno"
    "aprender-contracts-macros",  # [lib] name = "provable_contracts_macros"
    "aprender-db",                # [lib] name = "trueno_db"
    "aprender-graph",             # [lib] name = "trueno_graph"
    "aprender-present-core",      # [lib] name = "presentar_core"
    "aprender-viz",               # [lib] name = "trueno_viz"
    "aprender-zram-core",         # [lib] name = "trueno_zram_core"
]

[package.metadata.docs.rs]
# Lean doc build: the full default feature set (swc/typescript-ast, c/cpp-ast via
# gimli+goblin, every tree-sitter grammar) pushes the docs.rs build past its
# 15-minute / memory limit for this large crate, which is why the docs.rs badge
# was failing. Document the core public API with the lightest parser (rust-ast)
# plus the always-on core (standard-deps), viz, and http-client. The heavy
# language-parser modules are feature-gated, so this still compiles cleanly.
no-default-features = true
features = ["standard-deps", "rust-ast", "viz", "http-client"]
# Set DOCS_RS environment variable to skip network operations
# `--generate-link-to-definition` is NOT listed: it is a nightly-only flag that
# needs `-Z unstable-options`, and docs.rs enables it by default regardless. It
# was a second failure hiding behind the first — the E0557 below aborted the
# build before rustdoc ever ran, so fixing that alone would have traded one
# broken build for another.
rustdoc-args = ["--cfg", "docsrs"]
# NO rustc-args. docs.rs turns `rustc-args` into RUSTFLAGS, which applies to the
# compilation of every DEPENDENCY as well as this crate — and `lexical-util
# 1.0.7` (arrow-cast → arrow → aprender-db → aprender-graph, a non-optional dep)
# opens with `#![cfg_attr(docsrs, feature(doc_auto_cfg))]`. `doc_auto_cfg` was
# removed in Rust 1.92, so defining `docsrs` for dependencies is what made the
# docs.rs build fail (E0557), for 3.28.2, 3.29.0 and 3.30.0 alike:
#
#     RUSTFLAGS="--cfg docsrs" cargo +nightly check -p lexical-util   → E0557
#                              cargo +nightly check -p lexical-util   → ok
#
# This crate has zero `cfg(docsrs)` sites of its own, so the flag bought nothing
# and cost the entire API documentation. `rustdoc-args` keeps `--cfg docsrs` for
# rustdoc, which is where `doc_cfg` is read and which never reaches deps.

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "\\[Unreleased\\]", replace = "[{{version}}] - {{date}}" },
]

# Lints (v2.0 - Learn from Rust Giants)
# Source: Elite Rust projects (tokio, serde, clap, syn, regex)
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
missing_docs = "allow"
dead_code = "allow"
# Coverage: Allow coverage cfg flags from cargo-llvm-cov
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)', 'cfg(coverage_attr_stable)'] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
complexity = { level = "warn", priority = -1 }
checked_conversions = "warn"
expect_used = "allow"

# New rust-1.94.0 lints that fire heavily on test code — allow rather than
# churn through hundreds of mechanical fixes. Track cleanup in follow-up tickets.
assertions_on_constants = "allow"
# cmp_owned removed 2026-04-17: fixed 3 test sites to use Path::new comparisons
# items_after_test_module removed 2026-04-17: moved trailing items in supply_chain.rs before test mod
module_inception = "allow"
# ptr_arg removed 2026-04-17: fixed 2 sites (&PathBuf → &Path)
# unnecessary_get_then_check removed 2026-04-17: fixed 6 test sites (get().is_none() → !contains_key())
# useless_format removed 2026-04-17: no violations
# doc_lazy_continuation removed 2026-04-17: fixed 1 site with blank line
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"           # Changed: fat→thin (10x faster linking, minimal size difference)
codegen-units = 16     # Changed: 1→16 (parallel codegen for faster builds)
panic = "abort"
strip = "symbols"
overflow-checks = false
# debug = true         # Removed: debug symbols in release bloat binary + slow linking

[profile.test]
opt-level = 0
lto = false
codegen-units = 256
incremental = true

[profile.test.package."*"]
opt-level = 0

[profile.dist]
inherits = "release"
lto = "thin"

# One package. `crates/pmat-dashboard` was the only member and is gone (see the
# commit that removed it: never published, zero dependents, zero tests).
#
# `[workspace.package]` and both `[workspace.lints.*]` tables went with it. They
# were not shared configuration: this manifest inherits NOTHING from them — it
# has no `.workspace = true` anywhere and states its own version, edition and
# lint levels — and the dashboard was the only crate that opted in. So they
# governed exactly one deleted crate.
#
# `[workspace.package] version` was pinned at 3.17.0 while this crate shipped
# 3.32.0, and that stale value is what `cargo metadata | .packages[0].version`
# read during a 3.32.0 release. The two `post-release.yml` selectors that were
# hardened to pick the package BY NAME because of it are kept as they are —
# selecting by name is correct regardless of how many members exist.
[workspace]
resolver = "2"
