# HTTP server stack (axum, tower, hyper) - for web dashboards and HTTP APIs
http-server = ["axum", "tower", "tower-http", "hyper", "hyper-util", "http-body-util"]

# Syntax highlighting for pmat query --code output
syntax-highlighting = ["syntect"]

# CSV reporting (defect reports).
# Issue #672: kept as a no-op alias so existing `--features reporting`
# invocations still resolve. CSV is now always compiled in (see `csv` above);
# there is no build in which `report --format csv` is unavailable.
reporting = []

# File watching (complexity --watch, TDG dashboard, config hot-reload)
watch = ["dep:notify"]

# System diagnostics (pmat diagnose)
diagnostics = ["sys-info"]

# DAP (Debug Adapter Protocol) for time-travel debugging
# Requires rmp-serde for MessagePack serialization (13 transitive deps)
