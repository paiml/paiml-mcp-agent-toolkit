# NEVER add to any feature bundle (default, full, all-languages, etc.)
broken-tests = []
# Feature flag for red-phase TDD tests (expected failures, not yet passing)
# Empty feature: exists only so cfg(feature = "red-phase-tests") compiles without warnings
# NEVER add to any feature bundle (default, full, all-languages, etc.)
red-phase-tests = []
# Feature flag for slow CLI integration tests (assert_cmd spawns binaries)
# Disabled by default for fast coverage - enable with --features cli-integration
cli-integration = []
# Experimental modules (not production-ready, 0% test coverage)
# These are feature-gated to exclude from default coverage measurement
# `dep:notify`: the AGENTS.md watcher imports `notify`, which is declared
# `optional = true` and was enabled by NO feature, so `--features agents-md` had
# never compiled (E0432: unresolved import `notify`).
agents-md = ["shell-words", "dep:notify"]  # AGENTS.md integration for AI agent guidance
mcp-integration = ["actix", "actix-rt", "crossbeam", "sysinfo", "dep:bytes", "libc"]  # MCP protocol integration experiments
# `dep:bytes`/`dep:http`: same defect as `agents-md` — both are declared
# `optional = true` and enabled by no feature, while the protocol adapters import
# them unconditionally under this gate.
unified-protocol = ["http-server", "dep:bytes", "dep:http"]  # Unified protocol layer experiments
agent-daemon = ["dep:notify"]  # Claude Code Agent Mode (daemon, MCP server, quality monitor)
rust-ast = ["quote", "proc-macro2", "tree-sitter", "tree-sitter-rust"]
typescript-ast = ["rust-ast", "swc_ecma_parser", "swc_common", "swc_ecma_ast", "swc_ecma_visit", "tree-sitter", "tree-sitter-typescript", "tree-sitter-javascript", "polyglot-typescript"]
python-ast = ["rust-ast", "tree-sitter", "tree-sitter-python"]
lua-ast = ["tree-sitter", "tree-sitter-lua"]
# ✅ Migration complete! All 5 files migrated from rustpython-parser to tree-sitter-python:
#   - tdg/analyzer_ast.rs (Phase 4)
#   - services/mutation/python_adapter.rs (Phase 5a)
#   - services/ast_python_compat.rs (Phase 5a)
#   - services/unified_python_analyzer.rs (Phase 5a)
#   - services/enhanced_python_visitor.rs (Phase 5b)
c-ast = ["tree-sitter", "tree-sitter-c"]
cpp-ast = ["c-ast", "tree-sitter-cpp", "gimli"]
# Feature to exclude demo/reporting functionality for minimal builds
demo = ["http-server", "dep:bytes", "dep:http"]

# HTTP client (reqwest) - for GitHub API, doc validation, git clone
