[package]
name = "pmat"
default-run = "pmat"
version = "3.32.0"
edition = "2021"
rust-version = "1.91.0"
authors = ["Pragmatic AI Labs"]
# CLI, MCP and HTTP. The note here used to say `pmat serve` reports "HTTP
# transport not yet implemented" and to restore HTTP "when `pmat serve` actually
# binds" — it binds now (EV-6, #999): `pmat serve --transport http` serves the
# tool surface over streamable HTTP, verified 401-without-token / 200-with.
# HTTP is in the DEFAULT feature set as of 3.32.0, so all three transports the
# description names are present in `cargo install pmat` with no flags.
description = "PMAT - Zero-config AI context generation and code quality toolkit (CLI, MCP, HTTP)"
homepage = "https://paiml.com"
repository = "https://github.com/paiml/paiml-mcp-agent-toolkit"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["mcp", "code-analysis", "refactoring", "quality", "ai"]
categories = ["command-line-utilities", "development-tools", "development-tools::testing"]
exclude = ["target/", "*.log", "*.profraw", ".pmat-cache", "proptest-regressions", ".pmat/", ".pmat-tickets/", ".pmat-work/", ".pmat-qa/", ".pmat-metrics/", ".pmat-baseline.json", "node_modules/", "*.pyc", "__pycache__/", "quality-report.json", "*.yaml.lock",
    # Not build inputs and not needed to compile the crate. The package was
    # 9.4 MiB against crates.io's 10 MiB ceiling — 94% — so one more asset
    # would have made the crate unpublishable, and an oversized upload does
    # not report a size error, it returns a bare 503.
    "/docs/", "/scripts/", "/rust-docs/", "/golden_traces/", "/ROADMAP.md",
    "/comprehensive_language_test/", "/artifacts/", "/coverage/", "*.crate"]
# PERF: Disable autotest discovery - 193 .rs files = 193 binaries = slow coverage
# Instead, use explicit [[test]] declarations for unified test binaries
autotests = false
autobenches = false

[[bench]]
name = "coverage_gaps_bench"
harness = false

[[bin]]
name = "pmat-agent"
path = "src/bin/pmat-agent.rs"
required-features = ["mcp-integration"]

[dependencies]
# Sovereign stack: shared utilities (batuta-common: old name, lib.name still batuta_common)
batuta-common = "0.1"

# Async runtime
# Sprint 46 Phase 4: Removed "io-std", "signal", "process" features (saves 180-280 KB)
# Note: Code refactored to use std::io, platform-specific signal handling, and std::process::Command
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time"] }
async-trait = { version = "0.1", optional = true }

# Actor framework (only used by mcp-integration feature)
actix = { version = "0.13", optional = true }
actix-rt = { version = "2.10", optional = true }

# Message passing (only used by mcp-integration feature: agents/messaging)
# bytes = "1.10" # Already defined below
crossbeam = { version = "0.8", optional = true }

# Resource management (only used by mcp-integration feature: resources/)
sysinfo = { version = "0.39", optional = true }  # Updated for reduced duplicates
libc = { version = "0.2", optional = true }

# Text similarity - Now using aprender::text::similarity (edit_distance_similarity)
# levenshtein = "1.0"  # REMOVED: Replaced by aprender sovereign stack

# Machine Learning (Pure Rust - no C++ dependencies)
# Migration to aprender complete (Sprint 45)
# Graph algorithms enhanced (Sprint 46) - added 8 new centrality & structural stats
# See: docs/specifications/aprender-ml-integration.md
# GH #625: `default = ["cli"]` pulls apr-cli -> aprender-profile, whose cross-platform
# deps sit under [target.'cfg(unix)'.dependencies] while the code importing them is
# compiled everywhere -- so `cargo install pmat` cannot link on Windows. pmat uses only
# the aprender library API, and aprender's lib.rs has zero `cfg(feature)` gates, so
# turning defaults off costs nothing here. Do not re-enable: every other aprender
# feature also implies `cli`.
aprender = { version = "0.61", default-features = false }  # Aprender monorepo: ML, stats, text similarity, sovereign stack foundation

# High-Performance Compute (SIMD/GPU)
aprender-compute = { version = "0.61", optional = true }
aprender-db = { version = "0.61", optional = true, default-features = false }

# Semantic Search Stack (Pure Rust - Zero API Keys)
# See: docs/specifications/semantic-search-feature.md
aprender-graph = { version = "0.61", default-features = false }  # CSR graph, PageRank, Louvain
aprender-rag = { version = "0.61", optional = true }  # RAG pipeline
aprender-viz = { version = "0.61", optional = true, features = ["terminal", "graph"] }

# Analytics GPU dependencies (optional, gated by analytics-gpu feature)
# Issue #79: Feature-gated architecture to prevent +3.8 MB binary bloat
wgpu = { version = "30.0", optional = true, features = ["wgsl"] }
pollster = { version = "0.4", optional = true }  # Async runtime for wgpu
bytemuck = { version = "1.14", optional = true }  # Safe cast for GPU buffers
arrow = { version = "57", optional = true }  # Arrow columnar format. MUST match aprender-db's arrow (57) — pmat passes RecordBatch/arrays across the aprender-db (lib `trueno_db`) boundary, so arrow type identity is required.
# Note: parquet is managed by trueno-db dependency

# Document indexing (PDF text extraction for `pmat query --docs`)
pdf-extract = { version = "0.12", optional = true }

# Serialization (pinned to avoid swc_common issue with serde::__private)
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
# `raw_value` is required by src/mcp_pmcp/stdio_frames.rs: without it a JSON-RPC
# id above u64::MAX is parsed into an f64 and echoed back as `1e+20`, which no
# host can correlate. It was already switched on by feature unification from a
# transitive dependency; declared here so a dependency change cannot silently
# reintroduce the defect.
serde_json = { version = "1.0", default-features = false, features = ["std", "raw_value"] }
rmp-serde = { version = "1.3", optional = true }  # MessagePack for .pmat recording format (Sprint 75)

# Template engine (minijinja: fewer deps than handlebars, sovereign stack alignment with aprender)
minijinja = { version = "2.16", default-features = false, optional = true }

# MCP SDK - now core dependency for MCP server functionality
# Sprint 46 Phase 4: Switched from "full" to explicit features (saves 150-250 KB)
pmcp = { version = "2.17", features = ["websocket", "http", "sse", "validation"] }
# Streamable-HTTP MCP transport (EV-6, #999). Opt-in rather than default: it is
# the only thing that needs pmcp's `streamable-http`, which adds axum 0.8,
# axum-core, matchit and tower-http 0.7 — four crates, and two of them are
# DUPLICATE MAJORS of crates already in the tree (axum 0.7.9, tower-http 0.6.11).
# Measured: 442 -> 446 unique crates, packaged size unchanged at 7.4 MiB. It
# adds no rustls/hyper-rustls, which are already present via pmcp's `http`.

# Caching
lru = { version = "0.18", features = ["hashbrown"], optional = true }

# Error handling
thiserror = "2.0"
anyhow = "1.0"
tempfile = { version = "3.8", optional = true }

# Logging
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"], optional = true }

# Utilities
sha2 = { version = "0.11", optional = true }
# once_cell removed: migrated to std::sync::LazyLock/OnceLock (Rust 1.80+)
lazy_static = { version = "1.5", optional = true }
semver = { version = "1.0", features = ["serde"], optional = true }
regex = { version = "1.11", features = ["perf"] }
chrono = { version = "0.4.38", features = ["serde"] }  # Arrow-compatible (>=0.4.38)
globset = { version = "0.4", optional = true }
# Issue #672: `csv` used to be optional behind the non-default `reporting`
# feature, so every `cargo install pmat` build advertised `report --format csv`
# in --help and then failed at runtime with rc=1 and
# "CSV reporting requires the 'reporting' feature". csv 1.3 pulls only
# csv-core/itoa/ryu/serde, so it is now unconditional and the advertised format
# works in every build configuration, not just one nobody enables.
csv = { version = "1.3" }
# hex removed from [dependencies]: replaced with inline format!("{:02x}") (CB-081)
uuid = { version = "1.17", features = ["v4", "v7", "serde"], optional = true }
parking_lot = { version = "0.12", optional = true }
dirs = { version = "6.0", optional = true }
roaring = { version = "0.11", optional = true }
rand = { version = "0.10", optional = true }
rayon = { version = "1.10", optional = true }
# Optional: saves 67 transitive deps when disabled - falls back to shell `git` commands
git2 = { version = "0.21", default-features = false, features = ["https"], optional = true }

# CLI utilities - REMOVED to save transitive deps
# dialoguer = "0.12"  # REMOVED: Replaced with simple stdin (saves 14 transitive deps)
# console = "0.16"  # REMOVED: Replaced with plain text (saves 3 transitive deps)
# indicatif = "0.18"  # REMOVED: Replaced with simple println (saves 6 transitive deps)
url = { version = "2.5", optional = true }

# Syntax highlighting for --code output (feature-gated: syntax-highlighting)
syntect = { version = "5.2", default-features = false, features = ["default-fancy"], optional = true }

# Storage
# libsql = "0.9.24"  # REMOVED: Not used directly (migration to rusqlite complete)
lz4_flex = { version = "0.14", optional = true }  # Legacy index format
aprender-zram-core = { version = "0.63", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }  # SQLite with bundled library
# sled = REMOVED (unmaintained, migrated to libsql/trueno-db)
# rocksdb = { version = "0.22", default-features = false, features = ["zstd"] }
# bincode REMOVED: 3.0.0 is a non-functional placeholder release (compile_error),
# 2.x is a breaking rewrite. Replaced by rmp-serde (MessagePack), already in-tree.

# Async utilities
futures = { version = "0.3", optional = true }

# GitHub API client (Issue #75: Unified GitHub/YAML workflow)
# Optional: saves 255 transitive deps when disabled - falls back to `gh` CLI
octocrab = { version = "0.54", optional = true }

# File watching for configuration hot-reload (feature-gated: watch)
notify = { version = "8.0", optional = true }

# CLI support
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "env"] }
num_cpus = { version = "1.17", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }

# AST parsing (always needed for accurate complexity analysis)
syn = { version = "2.0", features = ["full", "parsing", "visit", "visit-mut", "extra-traits"] }
quote = { version = "1.0", optional = true }
proc-macro2 = { version = "1.0", optional = true }
walkdir = { version = "2.5", optional = true }
ignore = { version = "0.4", optional = true }
glob = { version = "0.3", optional = true }
toml = { version = "1.1", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
which = { version = "8.0", optional = true }  # Sprint 70: Find cargo-mutants in PATH
# For TypeScript/JavaScript parsing (conditional) - use compatible versions
swc_ecma_parser = { version = "43.0", optional = true }
swc_common = { version = "24.0", optional = true }
swc_ecma_ast = { version = "27.0", optional = true }
swc_ecma_visit = { version = "27.0", optional = true }
# For Python parsing (conditional) - REMOVED: Migrated to tree-sitter-python
# rustpython-parser = { version = "0.4.0", optional = true }
# For C/C++ parsing (conditional)
tree-sitter = { version = "0.26", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-lua = { version = "0.5", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
# Sprint 46 Phase 6: Removed unused tree-sitter parsers (0 references - cargo-machete verified)
# tree-sitter-c-sharp = { version = "0.23", optional = true }  # 0 references
# tree-sitter-java = { version = "0.23", optional = true }      # 0 references
# tree-sitter-ruby = { version = "0.23", optional = true }      # 0 references
# tree-sitter-scala = { version = "0.20.0", optional = true }   # 0 references
# tree-sitter-swift = { version = "0.7", optional = true }      # 0 references
# Sprint 46 Phase 5: Removed unused language parsers (1.25 MB release binary savings)
# tree-sitter-erlang = { version = "0.15", optional = true }
# tree-sitter-elixir = { version = "0.3", optional = true }
# tree-sitter-haskell = { version = "0.23", optional = true }
# tree-sitter-ocaml = { version = "0.23", optional = true }
# For Ruchy language support (Ruby alternative parser)
ruchy = { version = "4.2.1", optional = true }
gimli = { version = "0.34", optional = true }
rustc-hash = { version = "2.1", optional = true }

# Installer generation
# installer-macro = { path = "../installer-macro" } # Removed - using simple include_str! instead
blake3 = { version = "1.8", features = ["serde"], optional = true }
xxhash-rust = { version = "0.8", features = ["xxh64"], optional = true }

# Demo/reporting mode dependencies (included by default)
# webbrowser = "1.0"  # REMOVED: Replaced with platform-specific shell commands (saves 77 transitive deps)
bytes = { version = "1.10", optional = true }
http = { version = "1.3", optional = true }
# httparse = "1.10"  # REMOVED: cargo-machete verified unused (hyper handles HTTP parsing)
dashmap = { version = "6.1", optional = true }
flate2 = { version = "1.1", optional = true }
# smallvec = "1.15.0"  # REMOVED: cargo-machete verified unused

# Unified protocol support (feature-gated: http-server)
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"], optional = true }
# capnp = "0.20" # REMOVED: Unused Cap'n Proto serialization (0 references)
# capnpc = "0.20" # REMOVED: Unused Cap'n Proto compiler (0 references)
tower = { version = "0.5", default-features = false, features = ["util", "timeout"], optional = true }
# Sprint 46 Phase 4: Removed "fs" feature (no ServeDir/ServeFile usage, saves 40-70 KB)
tower-http = { version = "0.7", default-features = false, features = ["trace", "compression-gzip", "timeout", "cors"], optional = true }
# Sprint 46 Phase 4: Removed "client" feature (reqwest provides HTTP client, saves 80-120 KB)
hyper = { version = "1.6", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "client"], optional = true }
http-body-util = { version = "0.1", optional = true }

# Graph analysis (trueno-graph replaces petgraph)
# nalgebra-sparse removed - using simple Vec-based sparse matrices (Sovereign AI Stack)

# Markdown parsing
pulldown-cmark = { version = "0.13", optional = true }

# HTTP client for GitHub API (optional - feature-gated behind http-client)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs"], optional = true }

# Prometheus metrics (optional - rarely used)
prometheus = { version = "0.14", optional = true }
warp = { version = "0.4", optional = true, features = ["server"] }  # 0.4 gates serve()/Server behind the `server` feature

# Table formatting - REMOVED: Using simple println formatting (saves 16 transitive deps)
# prettytable-rs = "0.10"

# TUI support (presentar-terminal: ratatui-free Brick architecture)
# presentar-terminal provides: TuiApp, DiffRenderer, BrailleGraph, Meter, Table
# Benefits: Jidoka verification gates, zero-allocation rendering, 95% coverage
# presentar-terminal = { version = "0.3.0", path = "../../presentar/crates/presentar-terminal", optional = true }  # Not yet on crates.io
aprender-present-core = { version = "0.61", optional = true }
# crossterm 0.28 matches presentar-terminal's version (ratatui REMOVED)
crossterm = { version = "0.29", optional = true }
sys-info = { version = "0.9.1", optional = true }

# Storage backends (sled/rocksdb REMOVED - migrated to libsql/trueno-db)
wasmparser = { version = "0.255", optional = true }
shell-words = { version = "1.1.0", optional = true }
crc32fast = { version = "1.5.0", optional = true }
# pest = "2.8.2"  # REMOVED: WorkflowParser never instantiated, DslCompiler uses serde
# pest_derive = "2.8.2"  # REMOVED: Dead code (pest grammar unused)

# Deep WASM inspection dependencies
# wasm-encoder = "0.239.0"  # REMOVED: cargo-machete verified unused
# walrus = "0.22" # REMOVED: Unused (0 references in codebase)
# object = "0.37"  # REMOVED: cargo-machete verified unused
sourcemap = { version = "9.0", optional = true }  # Only needed for deep-wasm source map support
# ahash = "0.8"  # REMOVED: cargo-machete verified unused
prettyplease = { version = "0.2.37", optional = true }
fs2 = { version = "0.4.3", optional = true }
aprender-contracts-macros = "0.61"


[dev-dependencies]
aprender-contracts = "0.61"
rmp-serde = "1.3"  # MessagePack codec for integration tests (replaces bincode after its removal)
dhat = "0.3"
tokio-test = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "rustls-native-certs"] }
tempfile = "3.20"
assert_cmd = "2.0"      # CLI testing for PMAT-7001
predicates = "3.1"      # Assertion helpers for PMAT-7001
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.6"
serial_test = "3.2"
tokio-util = "0.7.18"

[build-dependencies]
ureq = "3.0"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# hex removed: generated code now uses inline hex_decode_templates() (CB-081)
sha2 = { version = "0.11", optional = true }  # For O(1) build artifact hash caching
# capnpc = "0.20" # REMOVED: Unused Cap'n Proto compiler

# ── Release gates this crate OWNS ───────────────────────────────────────────
#
# Read by scripts/dogfood/pmat-dogfood_gates.py, the ONE parser of this table.
# Each entry gets its own row in the release receipt: rolling them into one
# aggregate verdict is how a red gate hides behind a green neighbour.
#
# An ABSENT table and `gates = []` are both FAIL, deliberately. A crate claiming
# zero release gates of its own has made a claim, and an unmade claim reads
# exactly like a satisfied one.
#
# These two are the wiring for SKILL.md §11 and §12, which the 2026-08-23 project
# audit found DOCUMENTED BUT UNRUN — this repo's signature defect, sitting in its
# own release protocol.
[package.metadata.dogfood]
gates = [
    "scripts/dogfood/pmat-gate-fleet.sh",
    "scripts/dogfood/pmat-gate-transport-parity.sh",
]

[features]
# EV-6 (#999): serve the MCP tool surface over streamable HTTP, for clients that
# cannot use stdio (the Google Antigravity Agent registers `{"type":"mcp_server",
# "url": ...}` and supports streamable HTTP only — no SSE, and loopback is
# blocked by its egress proxy).
mcp-http = ["pmcp/streamable-http"]
# Phase 2 Build Performance (Issue #89): Minimal defaults for fast builds
# Default: Rust + TypeScript/JavaScript (most common use case)
# - Opt-in for other languages: --features extended-languages or all-languages
# - Opt-in for advanced analysis: --features analytics-simd, mutation-testing, demo
# - Full suite: --features full (equivalent to old defaults)
# All THREE transports in the default build: CLI, MCP over stdio, HTTP.
#
# `mcp-http` was opt-in, so `cargo install pmat` produced a binary whose
# `serve --help` said "[HTTP NOT COMPILED IN this build]". The crate
# description has claimed "(CLI, MCP, HTTP)" throughout, and two of the three
# were true by default. A user reading the description and running the install
# command got a binary that could not do the third.
#
# The cost is build time and dependency surface (`pmcp/streamable-http` pulls
# the hyper/tower stack). That is the right trade for a transport the package
# advertises on its front page: a feature nobody can reach without knowing a
# flag name is close to a feature that does not ship.
default = ["core-languages", "viz", "http-client", "standard-deps", "mcp-http"]

# Standard deps bundle — feature-gated for dep count reduction but enabled by default
standard-deps = [
    "minijinja", "tracing-subscriber", "semver", "globset",
    "roaring", "rand", "url", "lz4_flex", "rmp-serde", "crossbeam-channel",
    "lru", "lazy_static", "dirs", "ignore", "xxhash-rust",
    "flate2", "crc32fast", "fs2", "pulldown-cmark", "aprender-rag", "num_cpus",
    "sha2", "uuid", "futures", "serde_yaml_ng", "blake3", "dashmap",
    "rayon", "rusqlite", "glob", "toml", "rustc-hash", "walkdir",
    "tempfile", "parking_lot", "async-trait",
]

# Convenience bundles
#
# `core-languages` implies `standard-deps` because the analysis pipeline is
# pervasively coupled to the crates in `standard-deps` (walkdir, toml,
# async-trait, uuid, dashmap, rusqlite, parking_lot, globset, futures,
# num_cpus, dirs, ignore, tempfile, serde_yaml_ng, glob, rustc-hash, sha2,
# bincode, roaring, etc.). Carving them out of `--features core-languages,viz`
# breaks ~900 compile errors across ~400 files (D103). Users who want a truly
# minimal build with no language AST parsers should use `--features rust-only`
# or wait for a dedicated `minimal` feature with proper cfg gating.
core-languages = ["standard-deps", "rust-ast", "typescript-ast", "javascript-ast", "python-ast", "lua-ast", "lean-ast", "c-ast", "cpp-ast"]  # Most common: Rust + JS/TS + Python + Lua + Lean + C/C++
extended-languages = ["go-ast", "c-ast", "cpp-ast", "shell-ast", "php-ast", "swift-ast", "lean-ast"]  # Additional languages
advanced-analysis = ["analytics-simd", "mutation-testing", "tdg-explain", "demo"]  # Heavy features
full = ["all-languages", "polyglot-ast", "advanced-analysis", "doc-indexing"]  # Equivalent to old defaults
doc-indexing = ["pdf-extract"]  # PDF text extraction for `pmat query --docs`

# Phase 1 Build Performance (Issue #89): Removed "org-intelligence" from default
# - Eliminates octocrab v0.39.0 duplicate (we have v0.40.0)
# - Eliminates trueno-db v0.1.0 duplicate (we have v0.3.1)
# - Reduces build time and dependency count
# - org-intelligence now opt-in via --features org-intelligence
# `pmat org localize` works and is gated on this feature, so the feature name must
# survive. The dependency behind it did not: aprender-orchestrate 0.41 removed the
# OIP analyzer/report/summarizer API, leaving `pmat org analyze` stubbed, and the
# crate had zero `use` sites in pmat. It was pulling a full dependency subtree to
# provide nothing.
org-intelligence = []
all-languages = ["rust-ast", "typescript-ast", "python-ast", "c-ast", "cpp-ast", "ruchy-ast", "go-ast", "wasm-ast", "deep-wasm", "shell-ast", "php-ast", "swift-ast", "lua-ast", "lean-ast"]
most-languages = ["rust-ast", "typescript-ast", "python-ast", "c-ast", "cpp-ast", "go-ast", "shell-ast"]
# Sprint 46 Phase 6: Removed java-ast, csharp-ast, ruby-ast, scala-ast (0 references)
# Note: go-ast and shell-ast kept in most-languages (unified_go_analyzer.rs now has proper feature gates)
rust-only = ["rust-ast"]
# Polyglot AST meta-feature for cross-language analysis
polyglot-ast = []
ruchy-ast = ["ruchy"]
go-ast = ["tree-sitter", "tree-sitter-go"]
kotlin-ast = ["tree-sitter", "tree-sitter-kotlin-ng", "polyglot-kotlin"]
# Sprint 46 Phase 6/7: Empty feature declarations for backward compat (cfg checks)
# Dependencies removed but feature flags kept to satisfy #[cfg(feature = "...")] guards
java-ast = []
csharp-ast = []
ruby-ast = []
scala-ast = []

# Polyglot language-specific features
polyglot-kotlin = ["polyglot-ast"]
polyglot-typescript = ["polyglot-ast"]
polyglot-javascript = ["polyglot-ast"]
# Sprint 46 Phase 6/7: Empty polyglot feature declarations for backward compat (cfg checks)
polyglot-java = []
polyglot-scala = []
polyglot-csharp = []
polyglot-ruby = []
# Sprint 46 Phase 5: Removed unused language feature definitions
# erlang-ast = ["tree-sitter", "tree-sitter-erlang"]
# elixir-ast = ["tree-sitter", "tree-sitter-elixir"]
# haskell-ast = ["tree-sitter", "tree-sitter-haskell"]
