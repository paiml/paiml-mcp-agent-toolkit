# Profile configuration moved to workspace root

[package.metadata.docs.rs]
# Use default features for documentation (which excludes python-ast due to malachite-bigint build issues)
features = ["default"]
# Set DOCS_RS environment variable to skip network operations
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
rustc-args = ["--cfg", "docsrs"]

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "\\[Unreleased\\]", replace = "[{{version}}] - {{date}}" },
]

# Lints (v2.0 - Learn from Rust Giants)
# Source: Elite Rust projects (tokio, serde, clap, syn, regex)
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
missing_docs = "allow"
dead_code = "allow"
# Coverage: Allow coverage cfg flags from cargo-llvm-cov
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(coverage_nightly)', 'cfg(coverage_attr_stable)'] }

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
complexity = { level = "warn", priority = -1 }
checked_conversions = "warn"
expect_used = "allow"

# New rust-1.94.0 lints that fire heavily on test code — allow rather than
# churn through hundreds of mechanical fixes. Track cleanup in follow-up tickets.
assertions_on_constants = "allow"
# cmp_owned removed 2026-04-17: fixed 3 test sites to use Path::new comparisons
# items_after_test_module removed 2026-04-17: moved trailing items in supply_chain.rs before test mod
module_inception = "allow"
# ptr_arg removed 2026-04-17: fixed 2 sites (&PathBuf → &Path)
# unnecessary_get_then_check removed 2026-04-17: fixed 6 test sites (get().is_none() → !contains_key())
# useless_format removed 2026-04-17: no violations
# doc_lazy_continuation removed 2026-04-17: fixed 1 site with blank line
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"           # Changed: fat→thin (10x faster linking, minimal size difference)
codegen-units = 16     # Changed: 1→16 (parallel codegen for faster builds)
panic = "abort"
strip = "symbols"
overflow-checks = false
# debug = true         # Removed: debug symbols in release bloat binary + slow linking

[profile.test]
opt-level = 0
lto = false
codegen-units = 256
incremental = true

[profile.test.package."*"]
opt-level = 0

[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
members = ["crates/pmat-dashboard"]
resolver = "2"

[workspace.package]
version = "3.14.0"
edition = "2021"
authors = ["Pragmatic AI Labs"]
homepage = "https://paiml.com"
repository = "https://github.com/paiml/paiml-mcp-agent-toolkit"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -2 }
checked_conversions = "warn"
fallible_impl_from = "warn"
