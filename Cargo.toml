[workspace]
members = ["server","workspace-hack"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "2.200.1"
edition = "2021"
authors = ["Pragmatic AI Labs"]
homepage = "https://paiml.com"
repository = "https://github.com/paiml/paiml-mcp-agent-toolkit"

# Workspace-level lints (v2.0 - Learn from Rust Giants)
# Source: Elite Rust projects (tokio, serde, clap, syn, regex)
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"     # Require unsafe blocks inside unsafe functions
unreachable_pub = "warn"             # Warn on pub items not reachable from crate root
missing_docs = "allow"               # Allow missing docs (too noisy for internal crates)

[workspace.lints.clippy]
# Correctness lints (high priority)
correctness = { level = "deny", priority = -1 }
# Suspicious patterns (high priority)
suspicious = { level = "warn", priority = -1 }
# Performance improvements
perf = { level = "warn", priority = -1 }
# Style preferences
style = { level = "warn", priority = -1 }
# Pedantic lints (lower priority)
pedantic = { level = "allow", priority = -1 }
# Complexity analysis
complexity = { level = "warn", priority = -1 }
# Checked conversions (prevent overflow)
checked_conversions = "warn"
# Known Defects v2.1: Ban unwrap() (Cloudflare-class defect - causes production panics)
# TODO: Upgrade to "deny" after fixing all 3940 unwrap() calls
unwrap_used = "warn"
expect_used = "allow"

# Config for cargo-release
[workspace.metadata.release]
# Sign commits and tags
sign-commit = false  # Set to true if you have GPG configured
sign-tag = false     # Set to true if you have GPG configured
# Push to remote automatically
push-remote = "origin"
# Actually do the release (not just dry-run)
release = true
# Consolidate commits
consolidate-commits = true
# Disable dev-version bump (we handle this manually)
# dev-version = false  # This field is not recognized in newer cargo-release
# Share version for workspace
shared-version = true
# Tag prefix
tag-prefix = "v"
# Disable automatic publishing to crates.io (we handle it separately)
publish = false
# Pre-release replacements
pre-release-replacements = [
  {file="README.md", search="pmat = \"[0-9]+\\.[0-9]+\"", replace="pmat = \"{{version}}\""},
  {file="README.md", search="v[0-9]+\\.[0-9]+\\.[0-9]+ Release", replace="v{{version}} Release"},
  {file="CHANGELOG.md", search="## \\[Unreleased\\]", replace="## [Unreleased]\n\n## [{{version}}] - {{date}}"},
]
# Pre-release hook to run tests (disabled - no Makefile)
# pre-release-hook = ["make", "pre-release-checks"]

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]

[profile.release]
opt-level = 3            # Maximum performance optimization
lto = "fat"              # Enable Link Time Optimization
codegen-units = 1        # Single codegen unit for maximum optimization
panic = "abort"          # Remove unwinding machinery (~200KB savings)
strip = "symbols"        # Strip symbols (60-80% reduction)
overflow-checks = false  # Disable overflow checks in release
debug = true             # Enable debug symbols for flamegraph profiling

# The profile that 'cargo dist' will build with
# Workspace-level test optimization
[profile.test]
opt-level = 0
lto = false
codegen-units = 256
incremental = true

[profile.test.package."*"]
opt-level = 0

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
