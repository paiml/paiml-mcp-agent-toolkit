  acceptance_criteria:
  - 'NEXTEST_TEST_THREADS is raised from 4, or made a caller input: the container is given --cpus 8 and cargo test defaults to 8, so capping nextest at 4 makes it slower than the runner it replaces — measured on paiml/paiml-mcp-agent-toolkit#1316, 9,047 of 21,536 tests after 11 minutes'
  - a caller passing skip_coverage true gets a green ci/gate with the coverage job skipped, and the gate log names it as deliberately skipped
  - a coverage job skipped or cancelled for any other reason still fails the gate
  - the second case is proven by a workflow-level test rather than by reading the condition
  phases: []
