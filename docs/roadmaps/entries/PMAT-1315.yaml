  notes: sovereign-ci.yml documents skip_coverage as Skip coverage job; the coverage job is if not inputs.skip_coverage and the gate then refuses it because skipped counts as not-passed. The allowlist is correct — it was written after ci/security was cancelled on paiml/ruchy#197 and the gate passed 21 open advisories — but it makes the input unusable by any caller. ci/coverage costs ~29 minutes on every pmat PR and its only enforcement step is skipped there, so it is now the wall-clock floor of the PR lane after PMAT-1313.
