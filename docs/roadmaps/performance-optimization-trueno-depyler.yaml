fn extract_features_batch_simd(mutants: &[Mutant]) -> Matrix<f32> {
    // Extract features for all mutants at once
    let mut features = Matrix::zeros(mutants.len(), 18);

    // Batch processing with SIMD
    for (i, mutant) in mutants.iter().enumerate() {
        let feature_vec = extract_features_vectorized(mutant);
        features.set_row(i, &feature_vec);
    }

    // SIMD-accelerated normalization
