### Technical Design

**File**: `server/src/services/duplicate_detector.rs`

**Implementation**:
```rust
impl MinHashSignature {
    pub fn jaccard_similarity(&self, other: &MinHashSignature) -> f64 {
        #[cfg(feature = "simd")]
        { self.jaccard_similarity_simd(other) }

        #[cfg(not(feature = "simd"))]
        { self.jaccard_similarity_scalar(other) }
    }

    #[cfg(feature = "simd")]
    fn jaccard_similarity_simd(&self, other: &MinHashSignature) -> f64 {
        use trueno::Vector;

        // Convert u64 → f32 for SIMD
        let v1 = Vector::from_slice(&self_f32);
        let v2 = Vector::from_slice(&other_f32);

        // SIMD subtraction: diff[i] = v1[i] - v2[i]
        let diff = v1.sub(&v2)?;

        // Count matches (diff == 0.0)
        let matches = diff.as_slice()
            .iter()
            .filter(|&&val| val.abs() < 1e-6)
            .count();

        matches as f64 / self.values.len() as f64
    }
}
```

**Expected Speedup**: 4-8x (AVX2/AVX-512)
**Impact**: 400-800ms → 50-200ms per large project

