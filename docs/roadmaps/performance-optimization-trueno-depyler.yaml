# Background

## Problem Statement

PMAT has several performance bottlenecks identified through codebase analysis:

1. **Duplicate Detection MinHash** (400-800ms per large project)
   - Sequential Jaccard similarity comparisons
   - 200 hash functions × 20 bands configuration
   - 2M+ hash comparisons on 10K+ fragment codebases

2. **Graph PageRank Calculation** (1-3 seconds)
   - Iterative matrix multiplication on dependency graphs
   - O(n²) operations for 500+ node graphs
   - Sequential operations via petgraph

3. **ML Prediction Feature Extraction** (200-500ms per mutation batch)
   - 18-dimensional feature vector extraction
   - Repeated string scanning per feature
   - Sequential per-mutant processing

4. **Python AST Parsing** (200-500ms)
   - Multiple AST traversals via tree-sitter-python
   - Compatibility layer overhead
   - Redundant parsing operations

## Opportunity Analysis

**trueno v0.2.2** capabilities:
- SIMD backends: AVX-512 > AVX2 > SSE2 (x86_64), NEON (ARM), WASM SIMD
- Automatic backend selection
- 4-8x speedup for vector operations
- 6-12x speedup for matrix operations

**depyler** capabilities:
- Specialized Python AST parsing
- Potential 10-40% improvement over tree-sitter-python
- Single-pass extraction optimizations

