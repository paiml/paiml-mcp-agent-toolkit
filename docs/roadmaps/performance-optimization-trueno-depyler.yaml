## Phase 5: Defect Probability Batch Scoring

**Status**: PENDING
**Priority**: MEDIUM
**Estimated Effort**: 3-4 hours

### Objectives

- Batch normalization of input metrics
- Vector-based ensemble scoring
- SIMD-accelerated weighted average

### Technical Design

**File**: `server/src/services/defect_probability.rs` (lines 83-100)

**Current**: `0.35*churn + 0.30*complexity + 0.25*duplication + 0.10*coupling`

**Proposed**:
```rust
fn score_files_batch_simd(metrics: &[FileMetrics]) -> Vec<f64> {
    use trueno::{Vector, Matrix};

    // Create metrics matrix
    let churn = Vector::from_slice(&metrics.iter().map(|m| m.churn).collect::<Vec<_>>());
    let complexity = Vector::from_slice(&metrics.iter().map(|m| m.complexity).collect::<Vec<_>>());
    // ...

    // Weighted ensemble (SIMD)
    churn.scale(0.35)?
        .add(&complexity.scale(0.30)?)?
        .add(&duplication.scale(0.25)?)?
        .add(&coupling.scale(0.10)?)?
}
```

**Expected Speedup**: 4-8x
**Impact**: 100-300ms → 12-75ms

