## Phase 2: Graph PageRank Optimization

**Status**: PENDING
**Priority**: HIGH
**Estimated Effort**: 6-8 hours

### Objectives

- Replace petgraph PageRank with trueno matrix operations
- Implement SIMD-accelerated matrix multiplication
- Add iterative PageRank algorithm with trueno
- Batch computation of centrality metrics

### Technical Design

**File**: `server/src/services/fixed_graph_builder.rs`

**Current Bottleneck**:
- Lines 19: PageRank algorithm mentioned
- Lines 98-112: Applied to dependency graphs
- O(n²) iterations on adjacency matrix

**Proposed Optimization**:
```rust
use trueno::Matrix;

fn compute_pagerank_simd(adjacency: &Matrix<f32>, iterations: usize) -> Vector<f32> {
    let n = adjacency.rows();
    let mut rank = Vector::from_slice(&vec![1.0 / n as f32; n]);
    let damping = 0.85;

    for _ in 0..iterations {
        // Matrix-vector multiplication (SIMD-accelerated)
        let new_rank = adjacency.multiply_vector(&rank)?;

        // Damping and normalization (SIMD)
        rank = new_rank.scale(damping)?.add_scalar((1.0 - damping) / n as f32)?;
    }

    rank
}
```

**Expected Speedup**: 6-12x
**Impact**: 1-3 seconds → 100-250ms

