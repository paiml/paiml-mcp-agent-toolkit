[package]
name = "pmat-dashboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Pure WASM dashboard for PMAT using Presentar"
license = "MIT"
keywords = ["wasm", "dashboard", "visualization", "pmat"]
categories = ["visualization", "wasm", "gui"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Presentar - Pure WASM UI framework
presentar-core = { path = "../../../presentar/crates/presentar-core" }
presentar-widgets = { path = "../../../presentar/crates/presentar-widgets" }
presentar-layout = { path = "../../../presentar/crates/presentar-layout" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "console",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
] }

# Error handling
thiserror = "2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
proptest = "1.5"

[lints]
workspace = true

[features]
default = []
