[package]
name = "pmat-dashboard"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Pure WASM dashboard for PMAT using Presentar"
license = "MIT"
keywords = ["wasm", "dashboard", "visualization", "pmat"]
categories = ["visualization", "wasm", "gui"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2"

[dev-dependencies]
wasm-bindgen-test = "0.3"
proptest = "1.5"

[lints]
workspace = true

[features]
default = []
