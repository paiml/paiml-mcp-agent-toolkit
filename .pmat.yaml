comply:
  checks:
    cb-081:
      enabled: false
    cb-120:
      enabled: false
    cb-500:
      enabled: false
    cb-1202:
      enabled: false
    cb-600:
      enabled: false
    cb-900:
      enabled: false
  thresholds:
    min_tdg_grade: "A"
    pv_lint_is_error: true
    min_binding_existence: 95
    require_all_traits: true
    min_kani_coverage: 0
    tdg_exclude_paths:
      - "examples/*"
      - "src/tdg/analyzer_ast/analyzer_impl2_heuristics_lean.rs"
      - "tests/*"
      - "benches/*"
  suppressions:
    # Kubernetes manifests inherently have deep nesting (9-10 levels)
    - rules: ["CB-951"]
      files: ["deploy/kubernetes/deployment.yaml"]
      reason: "Kubernetes manifests require deep nesting by design"
    # GitHub Actions workflows have deep nesting for matrix/step/with patterns
    - rules: ["CB-951"]
      files: [".github/workflows/property-tests.yml", ".github/workflows/pr-checks.yml"]
      reason: "GitHub Actions matrix + step nesting is inherent"
    # CB-954 false positive: roadmap description text, not a secret
    - rules: ["CB-954"]
      files: ["docs/roadmaps/roadmap.yaml"]
      reason: "Long description text falsely matched as secret pattern"
    - rules: ["CB-954"]
      files: [".github/workflows/release.yml", ".github/workflows/ci.yml", ".github/workflows/nightly-bench.yml"]
      reason: "secrets: inherit is standard GHA reusable workflow syntax"
    - rules: ["CB-951"]
      files: [".github/workflows/release.yml"]
      reason: "Release workflow matrix requires deep nesting"
    - rules: ["CB-953"]
      files: [".github/workflows/release.yml", ".github/workflows/ci.yml"]
      reason: "paiml/.github reusable workflows canonical at @main"
    - rules: ["CB-122"]
      files: ["src/models/debug_analysis_coverage_props.rs", "src/services/facades/incremental_coverage_proptests.rs"]
      reason: "expect() in proptest roundtrips is idiomatic test code"

cross_crate:
  # Ruchy is a transpiler, not part of the ML/compute stack.
  # Cross-crate findings between ruchy and ML crates are false positives.
  excluded_crate_pairs:
    - "pmat:ruchy"
    - "aprender:ruchy"
    - "trueno:ruchy"
    - "trueno-viz:ruchy"
    - "trueno-db:ruchy"
    - "trueno-rag:ruchy"
  # Boilerplate: entry points and CLI scaffolding
  excluded_functions:
    - main
    - version
    - description
    - Cli
    - ExportFormat
    - OutputFormat
    - Severity
    - Token
    - Response
    - Value
    - Err
    - handle
    - builder
    - config
    - format
    - create_test_project
    # ML activation/operation names — independent implementations across crates,
    # different signatures are by design (tensor vs scalar, &self vs standalone)
    - sigmoid
    - gelu
    - relu
    - softmax
    - tanh
    - matmul
    - encode
    - decode
    - f16_to_f32
    - from_bytes
    - from_slice
    - margin
    - receive
    - close
    - tick
    - touch
    - title
    - labels
    - bits
    - HealthStatus
    # Domain-specific types that share names but have incompatible APIs
    # (different fields, derives, or methods across crates)
    - Color
    - CpuStats
    - CpuTimes
    - print_summary
    # Hardware capability types — pmat duplicates trueno's canonical types
    # for TOML config compatibility; consolidation blocked by dep direction
    - ByteBudget
    - lanes
    - bottleneck
  # Only flag CC-003 when source is actually similar
  cc003_min_similarity: 0.5
  min_body_lines: 5
  min_tokens: 15
