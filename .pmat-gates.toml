# PMAT Quality Gate Configuration
# Generated by: pmat quality-gates init

[gates]
# Run clippy linter
run_clippy = true

# Enforce strict clippy (-D warnings)
clippy_strict = true

# Run test suite
run_tests = true

# Test timeout in seconds
test_timeout = 300

# Check code coverage
check_coverage = true

# Minimum coverage percentage (0-100)
min_coverage = 80.0

# Check cyclomatic complexity
check_complexity = true

# Maximum cyclomatic complexity per function
max_complexity = 10

[exclude]
# Paths excluded from quality gate checks
paths = [
    "tests/**",
    "examples/**",
    "benches/**",
    "**/target/**",
]

[comply]
# CB-954 false positives: ML model contract YAML files use "token" in field names
# (eos_token, bos_token, embed_tokens, etc.) which triggers the secret detector
yaml_secret_exclude_paths = [
    "contracts/**/*.yaml",
    "docs/roadmaps/**/*.yaml",
]

[tdg]
# Exclude non-production code and dispatcher patterns from TDG grade gate
exclude = [
    "examples/**",
    "scripts/**",
    "benches/**",
    # Command dispatchers: inherently large match statements (architectural pattern)
    "src/cli/command_dispatcher/**",
    "src/cli/command_structure.rs",
]

# CB-200 RATCHET BASELINE — the count of definitions below `min_grade` that this
# repository has already agreed to carry. Optional: a project that omits this key
# gets zero tolerance, exactly as before.
#
# THIS IS NOT A THRESHOLD, AND IT IS NOT A PASS. 1,905 definitions grade below A
# across 1,053 files, at most 12 in any one file — a flat distribution with no
# hotspot and no bounded refactor. The gate reports that number on every run and
# refuses any increase, closed, naming the offenders. "Passing at baseline" reads
# as "debt held flat, not a clean tree", at Severity::Warning, because it is.
#
# WHY A NUMBER HERE IS NOT THE USUAL LIE. `.pmat-ratchet.toml`'s header:
# "A number in a config file that nobody re-runs is not a gate; it is a wish with
# a colon after it." `.pmat-metrics.toml:45` carries max_unwrap_calls = 100,
# annotated "Current: 570", in a tree measuring 20,390 — three numbers, no two
# agreeing, green throughout. This one is re-derived by CB-200 itself on every
# run, by the same query that produced it, and compared. It cannot become a
# transcription.
#
# THE FLOOR IS UNCHANGED. `min_grade` is not set here and `min_tdg_grade` in
# .pmat.yaml is untouched; no exclude glob was added for this. Both of those make
# debt invisible — one of them (187f506885) is how a past CB-200 "pass" was
# manufactured. Every unit of debt stays counted and printed.
#
# THE BASELINE MAY ONLY GO DOWN. Lower it whenever the tree beats it; CB-200 tells
# you the number to write. Raising it requires a written justification reviewed
# against the previous committed version of this file, the rule
# `.pmat-ratchet.toml` already applies to its own baselines. Note that nothing
# yet ENFORCES that on this key — CB-200 checks count-vs-baseline, not
# baseline-vs-prior-baseline.
#
# Derived, not transcribed — and derived under the config PRODUCTION USES, which
# is the correction that matters here. The first value committed was 1905, taken
# from `check_tdg_grade_gate(repo_root, ComplyConfig::default())`. Production
# does not use that config: `compute_compliance_report` loads `.pmat.yaml`,
# which carries four `tdg_exclude_paths` the default lacks. Exactly one row sits
# in the gap —
#     src/tdg/analyzer_ast/analyzer_impl2_heuristics_lean.rs :: analyze_lean_heuristic (F)
# — so the honest count is 1904 across 1052 files, not 1905 across 1053.
#
# The re-derivation test caught this before it was committed, which is the whole
# argument for re-deriving rather than transcribing: a baseline one higher than
# the truth is one free regression.
#
# 2026-08-22, LOWERED 1904 -> 1688 (216 fewer), and none of it is code that was
# rewritten. Two measurement defects were fixed in the grader:
#   * `count_complexity` charged every zero-argument closure `||` as a branch
#   * it evaluated control-flow keywords on COMMENT lines, including the `*`
#     continuation lines of a block comment
# and the index this was first measured against was STALE — `built_at`
# 2026-08-21T13:26, missing the 265 definitions added since, because
# `pmat query` does not rebuild a stale index, it only builds an absent one.
# Re-measured against a forced-fresh index at 23,716 definitions.
#
# A baseline may only go down, and banking a beaten one is not optional: slack
# is headroom a regression hides in.
baseline = 1688

[entropy]
# Entropy analysis configuration (#227)
enabled = true
# Minimum pattern diversity score (0.0-1.0). Files below this threshold are flagged.
min_pattern_diversity = 0.30
# Max allowed violations before entropy gate fails (null = any violation fails)
# max_violations = 10
# Additional paths to exclude from entropy checks
exclude = [
    "examples/**",
    "benches/**",
]

[dead_code]
# Library crates have higher "dead code" due to public APIs used by external consumers
# 30% threshold accounts for public APIs not called internally
max_dead_code_pct = 30.0

# ── Provable-contract ladder (L1–L5) ─────────────────────────────────────────
# audit: docs/specifications/audit-pmat-support-l1-l5-aprender-provable-contracts.md
[verification_ladder]
# Floor read by CB-1308 (check_verification_ladder): any equation-bearing
# contract-surface YAML that evidences BELOW this level fails comply. Set to
# the explicit L1 floor — this rejects the previously-permissive L0 default
# (ALADR-002). The lighthouse kernel `macs-ladder-kernel-v1` already evidences
# L3; ratchet this floor upward (L2 → L3) as the remaining registry/schema
# contracts climb. Per-crate budgets (`[[verification_ladder.budget]]`, so
# kernels can be held to L4 while registries stay at L1) are ALADR-002 / R-8.
min_level = "L1"
