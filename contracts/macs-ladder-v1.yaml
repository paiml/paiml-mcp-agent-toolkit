metadata:
  version: "1.0.0"
  created: "2026-07-02"
  author: PAIML Engineering
  references:
    - "docs/specifications/components/modern-agentic-coding-support.md (MACS v1.0.0)"
    - "arXiv:2602.22302 Bruni et al. (2026) Agent Behavioral Contracts"
    - "Popper (1959) The Logic of Scientific Discovery"
    - "Meyer (1997) Object-Oriented Software Construction 2e (Design by Contract)"
  registry: true
  description: >
    Typed L0-L5 verification ladder with evidence-gated completion (C28).
    MACS F2 (docs/specifications/components/modern-agentic-coding-support.md).
  contract: macs-ladder
  status: draft

equations:
  parse_total_strict:
    formula: parse(s) = Ok(l) <-> s in {"L0".."L5"}
    domain: s in String (proptest-generated incl. corruptions)
    codomain: Result<VerificationLevel>
    invariants:
      - Ord matches numeric order
      - Display then parse = id on valid set
    preconditions: []
    lean_theorem: Theorems.Macs.Ladder_Parse_Total

  gate_monotone:
    formula: complete(t)=Ok -> achieved_level(t) >= t.claimed_level
    domain: t in .pmat-work/*
    codomain: bool
    invariants:
      - achieved_level is computed from evidence, never stored
    preconditions:
      - binding.yaml well-formed (CB-1250 family)

falsification:
  - condition: "\"l4\" or \"L3 \" parses successfully"
    severity: P0
    action: reject_push
  - condition: "A ticket claiming L4 closes while a kani harness fails"
    severity: P0
    action: reject_push
  - condition: "A ticket claiming L5 closes with any `sorry` in its Lean proof"
    severity: P0
    action: reject_push

falsification_tests:
  - id: ladder_parse_strict_rejects_typos
    rule: Strict parse rejects case/whitespace corruptions
    prediction: parse("l4"), parse("L3 "), parse("strong") all fail strict parse
    test: cargo test --lib parse_total_strict_prop
    if_fails: misspelled levels silently downgrade tickets (C28)
  - id: ladder_ord_matches_numeric
    rule: Ord matches numeric order
    prediction: L0 < L1 < L2 < L3 < L4 < L5 under derived Ord
    test: cargo test --lib ord_matches_numeric
    if_fails: gate comparisons invert and over-claims pass the completion gate
  - id: ladder_serde_string_repr
    rule: Wire format stays the display string (no wire break)
    prediction: serde serializes L4 as "L4"; legacy contract.json still parses
    test: cargo test --lib serde_string_repr
    if_fails: every existing .pmat-work contract breaks on read
  - id: ladder_gate_monotone
    rule: complete implies achieved_level >= claimed level
    prediction: a ticket claiming L4 without kani evidence blocks with LadderShortfall
    test: cargo test --lib claim_l4_without_kani_blocks
    if_fails: tickets close above their evidenced level (C28 completion gates are hard)
