metadata:
  version: "1.0.0"
  kind: pattern
  created: "2026-09-17"
  author: PAIML Engineering
  references:
    - "paiml/paiml-mcp-agent-toolkit#1385 — pmat work migrate rewrote roadmap.yaml with a bare fs::write: no repository lock, no fragment mode"
    - "paiml/paiml-mcp-agent-toolkit#1370 — the in-repo bypass all three PMAT-1363 plan lanes found (latest comment, item 3)"
    - "contracts/roadmap-fragments-v1.yaml — RF-OB-005 (opted-in writers write fragments) and RF-OB-007 (writes wait for the repository lock), which this contract extends to every writer"
  registry: true
  description: >
    Every write that can land on a path under docs/roadmaps/ is made while the
    repository's exclusive roadmap lock is held. The claim is split in two, and each
    half is checked by something that can fail. The TYPE SYSTEM: every such write is
    a method of RoadmapWriteLock, a value that exists only while the flock is held,
    so a write through it that compiles is a locked write. The WRITER GATE: a taint
    analysis of every file the crate compiles outside cfg(test), from path literals
    naming docs/roadmaps or roadmap.yaml to the serialisation sites (fs::write,
    File::create, rename, copy, remove_file, create_dir_all, a writing OpenOptions::open, …), finds
    no raw write reaching a roadmap path outside RoadmapWriteLock. The gate reads what
    is written, not what a variable is called, so renaming a binding cannot satisfy
    it. `pmat work migrate` is the writer that bypassed the lock: it now reads,
    transforms and writes under one lock, keeps every byte its transform does not
    change, and in a repository with docs/roadmaps/entries/ never opens the generated
    roadmap.yaml for write.
  contract: roadmap-writer-lock
  status: enforced

equations:
  every_roadmap_write_goes_through_the_lock_token:
    formula: |
      sinks(src) = { s | s is a raw filesystem write in a file compiled outside cfg(test)
                         ∧ dest(s) ∈ taint*(path literals naming docs/roadmaps | roadmap.yaml) }
      ∀ s ∈ sinks(src) : (file(s), fn(s), kind(s)) ∈ ALLOWED, where ALLOWED is keyed by kind:
        RoadmapWriteLock::write {fs::write} · ::replace {fs::write, fs::rename, fs::remove_file}
        · ::remove {fs::remove_file} · ::create_dir_all {fs::create_dir_all}
        · open_lock_file {OpenOptions::open, fs::create_dir_all} · IdAuthority::in_git {fs::create_dir_all: <git common dir>/pmat}
      ∀ (f, k) ∈ ALLOWED : ∃ s ∈ sinks(src) : fn(s) = f ∧ kind(s) = k       [the allow-list is live, per kind]
    domain: "the syntax tree of every file reached from src/lib.rs and src/bin/*.rs through mod declarations and include! at any depth (inline module, impl, function body); include!(concat!(env!(OUT_DIR), ...)) resolved to the build script's output; any other computed include! fails the walk; cfg(test) items skipped. 3037 files, 4 of them generated, measured 2026-09-17"
    codomain: bool
    invariants:
      - "taint propagates through let and every pattern, owner-keyed struct fields, clap defaults, path-preserving methods and closures, and across calls to a fixpoint — never by an identifier's spelling"
      - "measured on 8915fe3e6: 11 raw writes reach a roadmap path; with RoadmapWriteLock in and the pre-fix migrate handler restored: 1 (write_migration); after the fix: 0"
    preconditions:
      - "a literal with whitespace is prose, not a path, and is not a source"

  a_write_through_the_token_holds_the_lock:
    formula: "RoadmapWriteLock::acquire(p) returns only after lock_exclusive(p) ∧ the token lives no longer than the lock"
    domain: "concurrent pmat processes on one repository"
    codomain: bool
    invariants:
      - "with_write_lock hands its closure &RoadmapWriteLock, which cannot escape the closure"
      - "aggregate --write receives the token through Access::Write; print and check hold the shared lock and have no token"

  migrate_is_a_locked_text_rewrite:
    formula: |
      ¬is_dir(entries) ⇒ roadmap' = transform(roadmap) ∧ (backup ⇒ roadmap.yaml.bak = roadmap)
      is_dir(entries)  ⇒ bytes(roadmap.yaml)' = bytes(roadmap.yaml) ∧ ¬exists(roadmap.yaml.bak)
                         ∧ ∀ f ∈ fragments : f' = transform(f)
                         ∧ ∀ r ∈ rows(base), r.id ∉ ids(fragments), transform(r) ≠ r : entries/<r.id>.yaml = transform(r)
      read, transform and write happen under one exclusive lock; --dry-run holds the shared lock and writes nothing
    domain: "pmat work migrate over a project path"
    codomain: bool
    invariants:
      - "every planned fragment passes check_fragment before the first write, so a refusal writes nothing"
      - "a changed BASE row followed by non-blank text that is not part of it (a footer comment, a top-level key after the list) is refused: split_entries runs the last row to the end of the file, and a superseding fragment would move that text"
      - "a change to the header is refused in fragment mode: it exists only in the generated roadmap.yaml"

proof_obligations:
  - type: invariant
    property: "RWL-OB-001 no raw write reaches a path under docs/roadmaps/ outside RoadmapWriteLock"
    formal: "∀ s ∈ sinks(src) : (file(s), fn(s), kind(s)) ∈ ALLOWED"
    applies_to: every_roadmap_write_goes_through_the_lock_token
  - type: invariant
    property: "RWL-OB-002 the gate can fail: a planted unlocked write is reported whether its path travels through a renamed binding, a helper parameter, a const, a struct field, a return value, a clap default, format!, or a .map closure, and for every sink kind; prose, reads and cfg(test) code are not reported"
    formal: "∀ m ∈ mutants : fn(m) ∈ sinks(m) ∧ ∀ c ∈ controls : sinks(c) = ∅"
    applies_to: tainted_sinks
  - type: invariant
    property: "RWL-OB-003 the allow-list is live: every allowed writer is still reached by taint from a real call site, so a broken source cannot turn the gate vacuous"
    formal: "∀ (f, k) ∈ ALLOWED : ∃ s ∈ sinks(src) : fn(s) = f ∧ kind(s) = k"
    applies_to: every_roadmap_write_goes_through_the_lock_token
  - type: invariant
    property: "RWL-OB-004 every write through the token waits for the repository's exclusive lock — migrate in both modes, work add, save, aggregate --write"
    formal: "held(lock) by another process ⇒ no write lands until release"
    applies_to: acquire
  - type: postcondition
    property: "RWL-OB-005 whole-file migrate changes only what its transform changes, and its backup is the roadmap read under the lock"
    formal: "roadmap' = transform(roadmap) ∧ bak = roadmap"
    applies_to: migrate_text
  - type: postcondition
    property: "RWL-OB-006 in a repository with entries/, migrate never opens roadmap.yaml for write: fragments are migrated in place, a changed base row gets a superseding fragment, an unchanged one gets none, and a dry run writes nothing"
    formal: "is_dir(entries) ⇒ bytes(roadmap.yaml)' = bytes(roadmap.yaml)"
    applies_to: plan_fragment_migration
  - type: precondition
    property: "RWL-OB-007 a fragment-mode migration that cannot write one of its rows writes none of them: an id that is not a filename, an id declared twice, or a base row followed by text that is not part of it (trailing blank lines are not text)"
    formal: "∃ r ∈ rows : ¬check_fragment(r) ⇒ Err ∧ entries' = entries"
    applies_to: plan_fragment_migration

falsification_tests:
  - id: RWL-F-001
    rule: "no raw roadmap write outside the token (RWL-OB-001)"
    prediction: "the tree test reports 0. Measured 2026-09-17: 11 on 8915fe3e6 (write_migration, replace_atomically ×3 kinds, write_fragment ×2, remove_fragment, open_lock_file, persist_new_row, replace_item_raw, write_roadmap_unlocked); with the pre-fix ticket_validate_migrate.rs restored over the fix: 1, write_migration; and still 1 with every roadmap_path binding in that handler renamed to zz, a tree on which `pmat query --literal \"fs::write(roadmap_path\"` no longer lists the file. The allow-list is keyed by sink kind: planting an fs::write in open_lock_file, or putting a raw fs::create_dir_all back in write_roadmap_unlocked, each turns the tree test RED (measured)"
    test: "cargo test --lib roadmap_writer_gate_every_roadmap_write_in_the_tree_goes_through_the_lock_token"
    if_fails: "a writer of docs/roadmaps/ bypasses the repository lock again and can undo a concurrent work add"
  - id: RWL-F-002
    rule: "the gate can fail (RWL-OB-002)"
    prediction: "the migrate shape, a renamed binding, a cross-file helper, consts/fields/returns/clap defaults/format!/closures and all eight sink kinds are reported; prose, reads and test code are not. Mutation measured 2026-09-17: removing the let-binding propagation turns 5 of the gate's tests RED. The module walk reaches an include! inside an impl, a #[path] module inside an inline module and a module declared in a function body, skips cfg(test), and fails on an include! it cannot locate; resolving #[path] from the file directory inside an inline module turns that test RED (measured)"
    test: "cargo test --lib -- roadmap_writer_gate_catches_the_migrate_shape roadmap_writer_gate_a_renamed_binding_is_still_caught roadmap_writer_gate_crosses_files roadmap_writer_gate_walk_reaches_nested_modules_and_includes roadmap_writer_gate_follows_consts_returns_fields_and_clap_defaults roadmap_writer_gate_sees_every_sink_kind roadmap_writer_gate_is_silent_on_unrelated_reads_and_tests roadmap_writer_gate_source_predicate"
    if_fails: "the gate passes a tree it cannot see into"
  - id: RWL-F-003
    rule: "the allow-list is live (RWL-OB-003)"
    prediction: "each of RoadmapWriteLock::write, ::replace, ::remove and open_lock_file is reached by taint from the real tree. Mutation measured 2026-09-17: removing the let-binding propagation turns this test RED"
    test: "cargo test --lib roadmap_writer_gate_every_allowed_writer_is_still_reached"
    if_fails: "a source or propagation rule broke and the tree test is vacuously green"
  - id: RWL-F-004
    rule: "a write through the token waits for the lock (RWL-OB-004)"
    prediction: "with the lock held from outside, migrate (whole-file and fragment mode), work add, save and aggregate --write do not land for 500 ms and land after release. Mutation measured 2026-09-17: dropping lock_exclusive from RoadmapWriteLock::acquire turns all four RED; with the pre-fix handler restored the migrate test is RED (it wrote roadmap.yaml while the lock was held)"
    test: "cargo test --lib -- work_migrate_waits_for_the_repository_lock roadmap_fragments_an_add_waits_for_the_repository_lock roadmap_fragments_a_save_waits_for_the_repository_lock roadmap_fragments_aggregate_write_waits_for_the_repository_lock"
    if_fails: "two pmat processes interleave a read-modify-write and one silently undoes the other"
  - id: RWL-F-005
    rule: "whole-file migrate keeps every byte it does not normalise (RWL-OB-005)"
    prediction: "a comment, an unknown key with a trailing comment and a block scalar survive; the backup equals the roadmap as read. A regression pin, green before and after: routing migrate through RoadmapService::save would turn it RED (save re-serialises the model, PMAT-679)"
    test: "cargo test --lib work_migrate_keeps_every_byte_it_does_not_normalise"
    if_fails: "pmat work migrate destroys the hand-written legacy roadmaps it exists to repair"
  - id: RWL-F-006
    rule: "fragment-mode migrate never opens the aggregate (RWL-OB-006)"
    prediction: "roadmap.yaml byte-identical and no .bak; the fragment's WIP becomes inprogress; the base row's done lands as entries/PMAT-001.yaml; PMAT-007 gets no fragment; a dry run writes nothing; the view reads Completed and InProgress. Mutations measured 2026-09-17: skipping base rows turns it RED; the pre-fix handler turns it RED (it rewrote roadmap.yaml)"
    test: "cargo test --lib work_migrate_in_fragment_mode_never_opens_the_aggregate"
    if_fails: "pmat work migrate edits the generated roadmap.yaml and the roadmap-fragment-parity gate refuses the pull request"
  - id: RWL-F-007
    rule: "a refused fragment-mode migration writes nothing (RWL-OB-007)"
    prediction: "a base row whose id cannot be a filename refuses the migration and entries/ stays empty, although PMAT-001 before it was migratable; a last row followed by a footer comment and a top-level key is refused with roadmap.yaml byte-identical and entries/ empty, while the same row followed only by blank lines migrates. Mutations measured 2026-09-17: skipping the check-before-write loop turns the first RED; disabling the text-after-row check turns the second RED; a block scalar whose text starts with # and a comment indented inside the row stay the row's own lines and migrate; restoring the rule that skipped #-lines turns that arm RED (measured)"
    test: "cargo test --lib -- work_migrate_in_fragment_mode_refuses_before_writing_anything work_migrate_in_fragment_mode_refuses_to_carry_text_after_the_last_row"
    if_fails: "a failed migration leaves half its fragments behind"
