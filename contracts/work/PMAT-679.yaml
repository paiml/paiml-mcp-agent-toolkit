# Hand-authored work contract for PMAT-679 (roadmap re-serialisation, #1193/#1169 second half, aprender #2874). Every evidence_method is a command
# run on this tree by the orchestrator; the lib tests are compiled from
# src/cli/handlers/work_handlers/mod.rs (#[path]) under CI's cargo test --lib.
name: "PMAT-679"
metadata:
  version: "1.0.0"
  kind: pattern
  description: "work add appends the raw row and work edit replaces one block; every untouched roadmap entry stays byte-identical"
  references:
    - "src/services/roadmap_text.rs"
    - "src/services/roadmap_service_operations.rs"
    - "src/cli/handlers/work_handlers/ticket_crud.rs"
    - "src/tests/work_add_append_only_tests.rs"
    - "https://github.com/paiml/paiml-mcp-agent-toolkit/issues/1193"
surface: work-contract
verification_summary:
  target_level: L1
  current_level: L1
  total_obligations: 3
proof_obligations:
- id: "PO-1"
  statement: "On a fixture with a leading comment, an unknown key, a flow-style row, a block scalar and a trailing comment, work add produces new_text == old_text + exactly one rendered block; the file still parses and validates; the changed lines are the block's lines and nothing else."
  evidence_method: "env -u RUST_MIN_STACK cargo test --lib -- --exact cli::handlers::work_handlers::work_add_append_only_tests::work_add_append_only_add_appends_the_row_and_rewrites_nothing"
- id: "PO-2"
  statement: "work edit of one row's title changes only that row's block; every other line of the old file is present verbatim, in order; a roadmap: [] file opens into a block sequence; the pure operations refuse an absent or duplicated id."
  evidence_method: "env -u RUST_MIN_STACK cargo test --lib -- work_add_append_only_edit_replaces_only_the_edited_block work_add_append_only_add_opens_an_empty_flow_sequence work_add_append_only_pure_operations_refuse_what_they_cannot_locate"
- id: "PO-3"
  statement: "Discrimination: with the add path routed back through the whole-file serde writer, PO-1 fails while work_add_refuses_invalid_* and work_add_allocator_* stay green (observed on the branch, restored; re-observed by the orchestrator)."
  evidence_method: "git log --format=%s | grep -c 'MUTATION PMAT-679'   # 0 on the merged branch"
falsifiable_claims:
- hypothesis: "On a fixture with a leading comment, an unknown key, a flow-style row, a block scalar and a trailing comment, work add produces new_text == old_text + exactly one rendered block; the file still parses and validates; the changed lines are the block's lines and nothing else."
  method: "env -u RUST_MIN_STACK cargo test --lib -- --exact cli::handlers::work_handlers::work_add_append_only_tests::work_add_append_only_add_appends_the_row_and_rewrites_nothing"
  from_step: "1"
- hypothesis: "work edit of one row's title changes only that row's block; every other line of the old file is present verbatim, in order; a roadmap: [] file opens into a block sequence; the pure operations refuse an absent or duplicated id."
  method: "env -u RUST_MIN_STACK cargo test --lib -- work_add_append_only_edit_replaces_only_the_edited_block work_add_append_only_add_opens_an_empty_flow_sequence work_add_append_only_pure_operations_refuse_what_they_cannot_locate"
  from_step: "2"
- hypothesis: "Discrimination: with the add path routed back through the whole-file serde writer, PO-1 fails while work_add_refuses_invalid_* and work_add_allocator_* stay green (observed on the branch, restored; re-observed by the orchestrator)."
  method: "git log --format=%s | grep -c 'MUTATION PMAT-679'   # 0 on the merged branch"
  from_step: "3"
