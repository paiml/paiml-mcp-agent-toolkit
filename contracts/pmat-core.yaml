metadata:
  version: 1.0.0
  created: '2026-04-05'
  author: PAIML Engineering
  description: PMAT core contract — commit-level enforcement invariants
  references:
  - docs/specifications/components/commit-level-contract-enforcement.md
equations:
  refresh_bindings:
    formula: binding_index = scan(contracts/, binding.yaml)
    domain: project_path is Path, project_path.exists()
    codomain: binding_index in HashMap<String, Vec<String>>
    invariants:
    - binding_index.is_object() (valid JSON)
    - file_count <= binding_count (each file has at least 1 binding)
    preconditions:
    - binding_count.len() > 0
    lean_theorem: Theorems.Refresh_Bindings_Monotonic
  check_compliance:
    formula: check_result = run_cb_checks(project_path)
    domain: project_path in Path
    codomain: check_result in {Pass, Warn, Fail, Skip}
    invariants:
    - check_result != Panic (checks never panic)
    - cached_data.is_fresh() implies latency < 45ms
    preconditions:
    - checks.len() > 0
    lean_theorem: Theorems.Check_Determinism
  score_range:
    formula: score = hit_rate * throughput
    domain: hit_rate in [0.0, 1.0], throughput in [0.0, +inf)
    codomain: score in [0.0, +inf)
    invariants:
    - score >= 0.0 (non-negative product of non-negative factors)
    preconditions:
    - hit_rate >= 0.0
    - throughput >= 0.0
    lean_theorem: Theorems.Score_Range_NonNeg
proof_obligations:
- type: invariant
  property: TDG baseline valid JSON after every commit
  formal: is_json(.pmat/baseline.json)
  applies_to: all
  check: contract_tests::FALSIFY-PMAT-001
  severity: ERROR
- type: invariant
  property: Pre-commit hook < 30s
  formal: hook_duration < 30.seconds
  applies_to: all
  check: contract_tests::FALSIFY-PMAT-002
  severity: ERROR
- type: bound
  property: CB checks handle missing files gracefully
  formal: file.missing() implies check_result == Skip
  applies_to: all
  check: contract_tests::FALSIFY-PMAT-003
  severity: WARNING
falsification_tests:
- id: FALSIFY-PMAT-001
  rule: TDG baseline valid JSON
  prediction: .pmat/baseline.json is parseable as JSON after every commit
  test: Post-commit hook verifies JSON parses, fails commit if corrupt
  if_fails: TDG baseline corrupted, subsequent commits cannot compute drift
- id: FALSIFY-PMAT-002
  rule: Pre-commit hook performance budget
  prediction: hook completes in under 30 seconds
  test: .pmat-metrics/hook-timing.jsonl shows p95 < 30000ms over 10 runs
  if_fails: Hook exceeds budget, developers bypass with --no-verify
- id: FALSIFY-PMAT-003
  rule: CB check graceful degradation
  prediction: missing files produce Skip status, never panic
  test: cargo test --lib -- check_handlers -- with tempdir (no files)
  if_fails: Check panics on missing input, breaks CI for clean projects
kani_harnesses: []
verification_summary:
  total_obligations: 3
  l2_property_tested: 3
  l3_kani_proved: 0
  l4_lean_proved: 0
  l4_sorry_count: 0
