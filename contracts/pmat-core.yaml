metadata:
  version: 1.0.0
  created: '2026-04-05'
  author: PAIML Engineering
  description: PMAT core contract — commit-level enforcement invariants
  references:
  - docs/specifications/components/commit-level-contract-enforcement.md
  - src/models/comply_config_types.rs
equations:
  refresh_bindings:
    formula: binding_index = scan(contracts/, binding.yaml)
    domain: project_path is Path, project_path.exists()
    codomain: binding_index in HashMap<String, Vec<String>>
    invariants:
    - binding_index.is_object() (valid JSON)
    - file_count <= binding_count (each file has at least 1 binding)
    preconditions:
    - binding_count.len() > 0
    lean_theorem: Theorems.Refresh_Bindings_Monotonic
  # ── Declared because 1,187 annotation sites already assert them.
  #
  # `path_exists` (1,174 sites), `non_empty_index` (10) and `lint_valid` (3)
  # were cited by `#[provable_contracts_macros::contract("pmat-core.yaml",
  # equation = "...")]` throughout src/ and were NEVER DECLARED HERE. The macro
  # accepts any string, build.rs emits CONTRACT_*=bound without opening the
  # contract, and nothing checked that the name resolved — so 1,187 functions
  # carried what reads as a proof obligation and bound to nothing.
  #
  # They are declared rather than deleted because the annotations are not
  # decorative: the functions carrying `path_exists` really do require the path
  # to exist, and several assert it at runtime (`debug_assert!(path.exists())`,
  # e.g. check_individual_basic.rs). Writing the equation down turns 1,187 dead
  # citations into live ones; deleting them would discard a precondition the
  # code actually holds.
  #
  # `contracts/pv-registry-integrity-v1.yaml` is what stops the next phantom.
  path_exists:
    formula: "analysed(path) implies exists(path) and readable(path)"
    domain: "path in Path"
    codomain: "Result<T, E> where E names the path"
    invariants:
      - "a path that does not exist is REFUSED, never reported as an empty result"
      - "the refusal names the path, so a typo is distinguishable from a clean tree"
    preconditions:
      - "the caller has resolved the path (no further canonicalisation is implied)"

  non_empty_index:
    formula: "query(index) requires count(index) > 0"
    domain: "index in AgentContextIndex"
    codomain: "Result<Vec<Hit>, E>"
    invariants:
      - "a query against an empty or absent index is REFUSED, not answered with zero hits"
      - "zero hits from a populated index is a measurement; zero hits from no index is not"
    preconditions:
      - "the index path is known to the caller"

  lint_valid:
    formula: "lint(source) yields findings union refusal, never silence"
    domain: "source in Path"
    codomain: "Result<Findings, E>"
    invariants:
      - "a linter that could not run is REFUSED, never reported as zero findings"
      - "findings are counted BEFORE any confidence or severity filter is applied"

  check_compliance:
    formula: check_result = run_cb_checks(project_path)
    domain: project_path in Path
    codomain: check_result in {Pass, Warn, Fail, Skip}
    invariants:
    - check_result != Panic (checks never panic)
    - cached_data.is_fresh() implies latency < 45ms
    preconditions:
    - checks.len() > 0
    lean_theorem: Theorems.Check_Determinism
  severity_resolution:
    formula: >
      severity(id) = (patch(id) applied over declared(id)).severity, where
      declared = default_checks() and patch = the `comply.checks:` map read from
      .pmat.yaml
    domain: >
      a check id, the declared check roster, and a possibly-partial
      `comply.checks:` map
    codomain: severity in {info, warning, error, critical}
    invariants:
    - "PMAT-630: a partial `checks:` map is a PATCH over the declared roster, never a replacement"
    - "an id ABSENT from the map keeps the severity and threshold the code declared for it"
    - "an entry that omits `severity:` keeps the declared severity; omitting `threshold:` keeps the declared threshold"
    - "an explicit `severity:` still overrides the declared one: merging must not make the config unwritable"
    - "an id the roster does not declare is added, not rejected: merging adds, it does not restrict"
    - "an unknown key inside a check entry is a parse ERROR, never a silently discarded override"
    - "a `comply:` section with no `checks:` key keeps the whole declared roster, not an empty map"
    - "the resolved roster is never smaller than the declared one"
    preconditions:
    - ".pmat.yaml parses as YAML"
  score_range:
    formula: score = hit_rate * throughput
    domain: hit_rate in [0.0, 1.0], throughput in [0.0, +inf)
    codomain: score in [0.0, +inf)
    invariants:
    - score >= 0.0 (non-negative product of non-negative factors)
    preconditions:
    - hit_rate >= 0.0
    - throughput >= 0.0
    lean_theorem: Theorems.Score_Range_NonNeg
  composite_bounded:
    formula: composite = geometric_mean(sub_scores)
    domain: sub_scores in Vec<f64>, all >= 0.0
    codomain: composite in [0.0, 100.0]
    invariants:
    - composite >= 0.0 (geometric mean of non-negatives)
    - composite <= max(sub_scores) (geometric mean never exceeds max)
    preconditions:
    - sub_scores.len() > 0
    lean_theorem: Theorems.Geometric_Mean_Bounded
  rps_category_sum:
    formula: total = sum(category.earned for category in categories)
    domain: categories in Vec<CategoryScore>
    codomain: total in [0.0, 289.0]
    invariants:
    - total >= 0.0
    - total <= sum(category.max for category in categories)
    preconditions:
    - categories.len() == 11
    lean_theorem: Theorems.Category_Sum_Bounded
  tdg_grade_monotonic:
    formula: grade = score_to_grade(tdg_score)
    domain: tdg_score in [0.0, 100.0]
    codomain: grade in {A, B, C, D, F}
    invariants:
    - tdg_score >= threshold implies grade >= corresponding_grade
    - higher score always yields same or better grade
    preconditions:
    - tdg_score >= 0.0
    lean_theorem: Theorems.TDG_Grade_Monotonic
  index_load_idempotent:
    formula: index = load(save(index))
    domain: index in AgentContextIndex
    codomain: loaded_index in AgentContextIndex
    invariants:
    - loaded_index.functions.len() == index.functions.len()
    - loaded_index.file_index.keys() == index.file_index.keys()
    preconditions:
    - index.functions.len() > 0
    lean_theorem: Theorems.Index_Roundtrip_Identity
  bm25_relevance_positive:
    formula: score = bm25(query, document, corpus)
    domain: query in String, document in String, corpus in Vec<String>
    codomain: score in [0.0, +inf)
    invariants:
    - score >= 0.0 (BM25 produces non-negative scores)
    - empty query implies score == 0.0
    preconditions:
    - corpus.len() > 0
    lean_theorem: Theorems.BM25_Non_Negative
  pagerank_convergent:
    formula: ranks = pagerank(graph, damping, iterations)
    domain: graph in CSRGraph, damping in (0.0, 1.0), iterations in N+
    codomain: ranks in Vec<f64>, sum(ranks) approx 1.0
    invariants:
    - all(r >= 0.0 for r in ranks)
    - sum(ranks) in [0.99, 1.01] (convergence within epsilon)
    preconditions:
    - graph.num_nodes() > 0
    - damping > 0.0 && damping < 1.0
    lean_theorem: Theorems.PageRank_Convergent
  muda_waste_bounded:
    formula: muda = compute_muda(project)
    domain: project in ProjectAnalysis
    codomain: muda in [0.0, 100.0]
    invariants:
    - muda >= 0.0 (waste score non-negative)
    - muda <= 100.0 (bounded)
    preconditions:
    - project.files.len() > 0
    lean_theorem: Theorems.Muda_Score_Bounded
proof_obligations:
- type: invariant
  property: TDG baseline valid JSON after every commit
  formal: is_json(.pmat/baseline.json)
  applies_to: all
  check: contract_tests::FALSIFY-PMAT-001
  severity: ERROR
- type: invariant
  property: Pre-commit hook < 30s
  formal: hook_duration < 30.seconds
  applies_to: all
  check: contract_tests::FALSIFY-PMAT-002
  severity: ERROR
- type: bound
  property: CB checks handle missing files gracefully
  formal: file.missing() implies check_result == Skip
  applies_to: all
  check: contract_tests::FALSIFY-PMAT-003
  severity: WARNING
falsification_tests:
- id: FALSIFY-PMAT-001
  rule: TDG baseline valid JSON
  prediction: .pmat/baseline.json is parseable as JSON after every commit
  test: Post-commit hook verifies JSON parses, fails commit if corrupt
  if_fails: TDG baseline corrupted, subsequent commits cannot compute drift
- id: FALSIFY-PMAT-002
  rule: Pre-commit hook performance budget
  prediction: hook completes in under 30 seconds
  test: .pmat-metrics/hook-timing.jsonl shows p95 < 30000ms over 10 runs
  if_fails: Hook exceeds budget, developers bypass with --no-verify
- id: FALSIFY-PMAT-003
  rule: CB check graceful degradation
  prediction: missing files produce Skip status, never panic
  test: cargo test --lib -- check_handlers -- with tempdir (no files)
  if_fails: Check panics on missing input, breaks CI for clean projects
kani_harnesses:
- id: KANI-PMAT-001
  obligation: geometric mean of non-negatives stays within [0, max]
  property: composite in [0.0, 100.0] for all sub_scores >= 0.0
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_geometric_mean_bounded
- id: KANI-PMAT-002
  obligation: geometric mean of an empty set is undefined, not zero
  property: sub_scores.len() == 0 implies no composite is produced
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_geometric_mean_empty
- id: KANI-PMAT-003
  obligation: geometric mean of identical values is that value
  property: all(s == k) implies composite == k
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_geometric_mean_identity
- id: KANI-PMAT-004
  obligation: a zero sub-score absorbs the geometric mean
  property: any(s == 0.0) implies composite == 0.0
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_geometric_mean_zero_absorbing
- id: KANI-PMAT-005
  obligation: impact score is never negative
  property: score >= 0.0 for all non-negative factors
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_impact_score_non_negative
- id: KANI-PMAT-006
  obligation: zero missed lines yields zero impact
  property: missed == 0 implies score == 0.0
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_impact_score_zero_missed
- id: KANI-PMAT-007
  obligation: impact is monotonic in missed lines
  property: missed_a <= missed_b implies score_a <= score_b
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_impact_score_monotonic_missed
- id: KANI-PMAT-008
  obligation: RRF score stays within its bound
  property: rrf in (0.0, 1.0] for rank >= 0
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_rrf_score_bounded
- id: KANI-PMAT-009
  obligation: RRF decreases monotonically with rank
  property: rank_a < rank_b implies rrf_a > rrf_b
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_rrf_score_monotonic_decreasing
- id: KANI-PMAT-010
  obligation: rank zero maximises RRF
  property: argmax(rrf) == 0
  bound: 8
  strategy: bounded_int
  solver: cadical
  harness: verify_rrf_rank_zero_maximum
verification_summary:
  total_obligations: 3
  l2_property_tested: 3
  l3_kani_proved: 10
  l4_lean_proved: 0
  l4_sorry_count: 0
