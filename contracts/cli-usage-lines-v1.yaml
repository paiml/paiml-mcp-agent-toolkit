metadata:
  version: "1.0.0"
  created: "2026-09-02"
  author: PAIML Engineering
  references:
    - "docs/specifications/pmat-architecture-crux-audit.md section 8.5 (CRUX-05, issue 1148, ticket PMAT-634)"
    - "Popper (1959) The Logic of Scientific Discovery"
  registry: true
  description: >
    Every pmat subcommand prints a usable Usage line, every CLI error names the
    offending token, and no guard in the tree may certify a usage section by the
    bare substring "Usage:". Cargo.toml built clap with default-features = false
    and without usage/error-context/suggestions; 70 of 71 subcommands printed an
    empty "Usage: " line and five separate guards passed on it.
  contract: cli-usage-lines
  status: draft

equations:
  usage_line_present:
    formula: "for every subcommand c, help(c) contains a line matching ^Usage:[ \\t]+\\S"
    domain: "pmat --help and pmat <c> --help for every advertised c"
    codomain: bool
    invariants:
      - "the line names the binary and the full command path, not a placeholder alone"
      - "generated by clap's usage feature, never by Command::override_usage or a hand-rolled printer"
    preconditions: []

  error_names_token:
    formula: "for an unknown flag f, stderr(pmat ... f) contains f"
    domain: "any subcommand invoked with an unrecognised flag or a misspelt subcommand"
    codomain: bool
    invariants:
      - "a near-miss subcommand is suggested (clap suggestions)"
      - "the error carries clap's 'For more information, try' footer (error-context)"
    preconditions: []

  no_blind_usage_guard:
    formula: "count of contains(\"Usage:\") predicates in src/ and tests/ = 0"
    domain: "src/**, tests/**"
    codomain: bool
    invariants:
      - "a guard asserts CONTENT after the heading, so an empty heading cannot satisfy it"
    preconditions: []

falsification:
  - condition: "A subcommand's --help prints an empty Usage: heading with green CI (CRUX-05, issue 1148)"
    severity: P0
    action: reject_push
  - condition: "A CLI error does not name the token it rejected"
    severity: P1
    action: reject_push
  - condition: "A bare contains(\"Usage:\") predicate returns to src/ or tests/"
    severity: P1
    action: reject_push

falsification_tests:
  - id: usage_line_present
    rule: "an empty Usage: heading is not a usage section"
    prediction: "help text 'Usage: \\n\\nOptions:' fails has_usage_section; 'Usage: pmat analyze complexity [OPTIONS]' passes"
    test: "cargo test --lib an_empty_usage_heading_is_not_a_usage_section"
    if_fails: "pmat's own docs checker certifies the defect it exists to catch"
  - id: error_names_token
    rule: "the error for --zzz-nope contains --zzz-nope, and a near-miss subcommand is suggested"
    prediction: "legs 3 and 4 of the spec section 8.5 script fail on the pre-fix binary and pass after"
    test: "bash scripts/cli-usage-audit.sh (the spec section 8.5 acceptance script) against the release binary"
    if_fails: "an agent cannot tell which of its arguments was wrong"
  - id: no_blind_usage_guard
    rule: "no bare contains(\"Usage:\") predicate in src/ or tests/"
    prediction: "grep -rn 'contains(\"Usage:\")' src/ tests/ | wc -l == 0"
    test: "grep -rn 'contains(\"Usage:\")' src/ tests/"
    if_fails: "the regression returns the way it arrived, past five green guards"
