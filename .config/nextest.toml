# Nextest configuration for pmat
# Optimized for fast coverage runs (bashrs-style)

[store]
dir = "target/nextest"

[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false
test-threads = "num-cpus"
# PMAT-1314. The default-filter that used to sit here excluded two tests
# (`eof_does_not_signal_while_a_request_is_in_flight`,
# `waits_for_every_outstanding_request`) that were believed to hang under
# nextest only, from an order dependency on a shared process. That belief was
# never verified: both tests hung under plain `cargo test --lib` too, and in
# isolation — the real cause was `EofSignalingTransport`'s 300s drain backstop
# being awaited to completion with nothing able to cancel it, which the tests
# now avoid via a per-instance override. See
# `src/mcp_pmcp/simple_unified_server.rs` (`drain_backstop` field and the two
# tests' doc comments). The local fast lane runs everything again.

[profile.coverage]
# Optimized for coverage runs with instrumentation
# Aggressive timeouts to prevent hung tests
retries = 0
slow-timeout = { period = "15s", terminate-after = 1 }
fail-fast = false
test-threads = "num-cpus"
status-level = "pass"
final-status-level = "slow"

[[profile.coverage.overrides]]
# Integration tests are slow under instrumentation
filter = 'test(/integration/)'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.coverage.overrides]]
# Property tests need more time under instrumentation
filter = 'test(/property/)'
slow-timeout = { period = "90s", terminate-after = 2 }

[[profile.coverage.overrides]]
# E2E tests are comprehensive
filter = 'test(/e2e/)'
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.ci]
retries = 1
slow-timeout = { period = "120s", terminate-after = 2 }
fail-fast = false

[[profile.ci.overrides]]
# E2E and coverage-boost tests spawn cargo subprocesses — need more time in CI
filter = 'test(/e2e/) | test(/coverage_boost/) | test(/calculator/)'
slow-timeout = { period = "300s", terminate-after = 3 }

[profile.gate]
# PMAT-1365. `make gate` (scripts/gate.sh, leg lib-tests) runs the lib suite under
# this profile. The required check it stands in for, `ci / gate`, runs
# `cargo test --lib`, which kills no test. The default profile kills at 120s, and
# under the whole suite's load it killed 16 tests that pass alone in under 90s
# (measured: the metrics_ratchet drive tests, the quality_proxy property tests,
# two roadmap_service property tests, test_handle_analyze_tdg_file) — a red that
# the required check never shows, which is the kind of gate somebody disables.
# So a test is reported slow at 60s and killed only at 10 minutes: a hang bound,
# not a speed budget. The default profile's default-filter still applies (the two
# PMAT-1314 tests that hang under nextest); gate.sh prints that difference.
slow-timeout = { period = "60s", terminate-after = 10 }
fail-fast = false
