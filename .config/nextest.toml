# cargo-nextest configuration for PMAT
# https://nexte.st/book/configuration.html

[profile.default]
# Skip tests marked with #[ignore] - includes slow/broken/external-service tests
# Toyota Way: Fast feedback loop, zero tolerance for slow tests in test-fast
# NOTE: cargo-nextest skips #[ignore] tests by default, no filter needed

[profile.ci]
# CI runs all non-ignored tests
retries = 2

[profile.all]
# Profile for running ALL tests including ignored ones
# Use with: cargo nextest run --profile all
